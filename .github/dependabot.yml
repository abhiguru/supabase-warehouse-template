version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/docker/postgres-meta"
      - "/docker/storage"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - "/docker/*"
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: "/docker"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
