version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The root jose is the unit tests' copy of the library the edge functions
      # carry in functions/vendor (scripts/edge-vendor/package.json), and
      # tests/edge-imports.test.mjs requires the two to be the same release.
      # Change both together, after a run on the edge runtime. Security updates
      # are still proposed.
      - dependency-name: jose
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: npm
    directory: "/docker/storage"
    schedule:
      interval: weekly
    # No version updates for this manifest, security updates only (a limit of 0
    # does exactly that). It is the dependency set of an upstream application at
    # a pinned tag; it moves when the upstream tag moves.
    open-pull-requests-limit: 0
    ignore:
      # A new major of one of its dependencies needs changes to the upstream
      # source, which this repository would have to carry as a patch. Majors are
      # therefore taken with a security reason or when the upstream tag moves,
      # by hand. Security updates are still proposed.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: docker
    directories:
      - "/docker/*"
    schedule:
      interval: weekly
    ignore:
      # The print service's base (docker/cups/Dockerfile). A new Ubuntu release
      # (22.10 counts as a minor of 22.04, and is not a long-term release)
      # changes CUPS and its printer drivers, and CI can only check that CUPS
      # starts, not that a printer prints. Move it with a printer at hand.
      - dependency-name: ubuntu
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The PDF renderer's base (docker/pdf-renderer/Dockerfile) is Node 24 LTS by digest.
      # Digest and patch updates come; a new major is a planned change of the runtime.
      - dependency-name: node
        update-types:
          - "version-update:semver-major"
      # A new PostgreSQL major needs a planned dump and reload of every
      # installation's data directory, not a changed line in a recipe. Minor and
      # patch releases of the pinned 17 line (tag and digest) are taken.
      - dependency-name: postgres
        update-types:
          - "version-update:semver-major"
      # The recipe installs this repository's manifest (docker/storage) over the
      # application the image ships. A new tag brings its own dependency set, so
      # the manifest is rebuilt from it in the same change (docker/storage/README.md).
      - dependency-name: supabase/storage-api
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  # The PDF renderer (docker/pdf-renderer): puppeteer-core is pinned exactly and goes with
  # the pinned chrome-headless-shell (CHS_VERSION in its Dockerfile, which Dependabot
  # cannot see; the weekly cft-freshness workflow watches it). Take a puppeteer-core
  # minor or major only together with the matching CHS bump. Its Docker base is covered
  # by "/docker/*" above.
  - package-ecosystem: npm
    directory: "/docker/pdf-renderer"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: puppeteer-core
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  # The sensor bridge's Python dependencies (python-kasa and what it needs), each pinned
  # in docker/sensor-bridge/requirements.txt. Its base image is covered by "/docker/*" above.
  - package-ecosystem: pip
    directory: "/docker/sensor-bridge"
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: "/docker"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
