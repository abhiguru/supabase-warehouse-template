version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The root jose is the unit tests' copy of the module the edge runtime
      # loads from functions/import_map.json, and tests/edge-imports.test.mjs
      # requires the two to be the same release. Change both together, after a
      # run on the edge runtime. Security updates are still proposed.
      - dependency-name: jose
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: npm
    directories:
      - "/docker/postgres-meta"
      - "/docker/storage"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - "/docker/*"
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: "/docker"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
