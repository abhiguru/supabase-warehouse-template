version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The root jose is the unit tests' copy of the library the edge functions
      # carry in functions/vendor (scripts/edge-vendor/package.json), and
      # tests/edge-imports.test.mjs requires the two to be the same release.
      # Change both together, after a run on the edge runtime. Security updates
      # are still proposed.
      - dependency-name: jose
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: npm
    directories:
      - "/docker/postgres-meta"
      - "/docker/storage"
    schedule:
      interval: weekly
    # No version updates for these two manifests, security updates only (a
    # limit of 0 does exactly that). Each is the dependency set of an upstream
    # application at a pinned tag. Tried on 2026-10-12: grouped, the pending
    # minor and patch updates were 44 and the metadata image did not build; one by one
    # they are 44 runs of the install job, and two of the first six broke the
    # postgres-meta type check. The manifests move when the upstream tag moves.
    open-pull-requests-limit: 0
    ignore:
      # These two manifests are the dependency sets of upstream applications
      # that the recipes build from a pinned source tag. A new major of one of
      # their dependencies needs changes to that source, which this repository
      # would have to carry as a patch (fastify5.patch and vitest4.patch are two
      # such patches, both taken for a security fix). Majors are therefore taken
      # with a security reason or when the upstream tag moves, by hand. Security
      # updates are still proposed.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # A 0.x package: its minors break too. 0.3.0 made the formatter an
      # optional peer dependency, which postgres-meta v0.99.0 does not install,
      # and no CI check calls the type generator.
      - dependency-name: "@supabase/postgrest-typegen"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Both fail the type check of postgres-meta v0.99.0, which the recipe runs
      # (found on 2026-10-12 with @types/pg 8.23.1 and @sentry/node 10.76.2):
      # the newer types no longer accept that source. They move with the
      # upstream tag. Patch updates are still proposed.
      - dependency-name: "@types/pg"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@sentry/node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: docker
    directories:
      - "/docker/*"
    schedule:
      interval: weekly
    ignore:
      # The recipe compiles imgproxy from a source tag and puts that binary into
      # this runtime image (docker/imgproxy/Dockerfile). A new major of the image
      # alone would pair a v3 binary with v4 libraries, and still start. Move the
      # source tag, its checksum, the build base, go.mod and this image together.
      - dependency-name: darthsim/imgproxy
        update-types:
          - "version-update:semver-major"
      # The print service's base (docker/cups/Dockerfile). A new Ubuntu release
      # (22.10 counts as a minor of 22.04, and is not a long-term release)
      # changes CUPS and its printer drivers, and CI can only check that CUPS
      # starts, not that a printer prints. Move it with a printer at hand.
      - dependency-name: ubuntu
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The build base of the same recipe: it goes with the imgproxy source tag.
      - dependency-name: imgproxy/imgproxy-base
        update-types:
          - "version-update:semver-major"
      # The recipe rebuilds /usr/bin/gotenberg from the source of the same tag
      # (docker/gotenberg/Dockerfile, gotenberg.go.mod). A new image tag alone
      # would ship the old binary inside the new Chromium/LibreOffice image while
      # the notices named the new version. Move the source tag, its checksum,
      # gotenberg.go.mod, the version flag and this image together. Digest
      # updates of the same tag still come.
      - dependency-name: gotenberg/gotenberg
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # A new PostgreSQL major needs a planned upgrade of every installation's
      # data directory, not a changed line in a recipe. So does the publisher's
      # 15.19 line (looked at on 2026-10-12, tag 15.19.0.004): it is a different
      # image, on Alpine and not Ubuntu (the recipe's apt-get step cannot run),
      # with another user id for postgres (100, was 105), without wal-g, and
      # tests/migrations.sh stops on it: the Storage schema is missing.
      - dependency-name: supabase/postgres
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The recipe builds postgres-meta from the source of the same tag, with
      # this repository's manifest and two patches (docker/postgres-meta). A new
      # tag moves the source checksum, the manifest and the patches together.
      - dependency-name: supabase/postgres-meta
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The recipe installs this repository's manifest (docker/storage) over the
      # application the image ships. A new tag brings its own dependency set, so
      # the manifest is rebuilt from it in the same change (docker/storage/README.md).
      - dependency-name: supabase/storage-api
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  # The sensor bridge's Python dependencies (python-kasa and what it needs), each pinned
  # in docker/sensor-bridge/requirements.txt. Its base image is covered by "/docker/*" above.
  - package-ecosystem: pip
    directory: "/docker/sensor-bridge"
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: "/docker"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
