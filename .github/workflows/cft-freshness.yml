name: Chrome for Testing freshness

# The PDF renderer pins chrome-headless-shell (ARG CHS_VERSION in docker/pdf-renderer/Dockerfile).
# Trivy cannot see that binary, so this weekly check is the control that notices a Chrome that
# has fallen behind (docs/CONTAINER_SECURITY.md, "PDF renderer"). The check, in `--mode fail`, fails when the pin
# is more than 14 days behind the current Stable; this workflow then opens or updates one issue, and closes it when
# the pin is current again. This issue is the only signal: release.yml runs the same script in warn mode and never
# blocks a tag on the Chrome pin (owner decision of 2026-10-26).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A manual run next to the scheduled one must not open a second issue: the issue search can lag behind a just-created issue.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Compare the pinned CHS_VERSION with Chrome for Testing Stable
        id: check
        run: |
          set +e
          node scripts/check-cft-freshness.mjs --mode fail 2> "$RUNNER_TEMP/cft.err" | tee "$RUNNER_TEMP/cft.out"
          status=${PIPESTATUS[0]}
          cat "$RUNNER_TEMP/cft.err" >&2
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo 'message<<EOF_CFT'
            cat "$RUNNER_TEMP/cft.out" "$RUNNER_TEMP/cft.err"
            echo 'EOF_CFT'
          } >> "$GITHUB_OUTPUT"
          # Status 2 is a failure of the check itself (network, bad answer); it fails the run without an issue.
          [[ "$status" != 2 ]] || exit 2
          # Any other status but 0 (current) and 1 (behind), e.g. 137 (killed), is no result either: never "current".
          [[ "$status" == 0 || "$status" == 1 ]] || { echo "::error title=Chrome for Testing check failed::scripts/check-cft-freshness.mjs exited with status $status."; exit 1; }
      - name: Open or update the issue, or close it when the pin is current
        # Status 2 (unknown: the release dates could not be read) neither opens nor closes an issue.
        if: steps.check.outputs.status != '2'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
          MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          if [[ "$STATUS" != 0 && "$STATUS" != 1 ]]; then
            echo "::error title=Chrome for Testing check failed::scripts/check-cft-freshness.mjs exited with status $STATUS, so there is no result. The issue is left as it is."
            exit 1
          fi
          title='Chrome for Testing pin is more than 14 days behind Stable'
          # Only this workflow's own issue (the repository is public: anyone can open one with the same title).
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --author app/github-actions --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [[ "$STATUS" == 1 ]]; then
            body=$(printf '%s\n\nBump `CHS_VERSION`, `CHS_SHA256` and puppeteer-core together (docs/CONTAINER_SECURITY.md, "PDF renderer"), then rebuild and scan the renderer image.\n\nRun: %s/%s/actions/runs/%s' "$MESSAGE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            if [[ -n "$number" ]]; then gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
            exit 1
          elif [[ -n "$number" ]]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The pin is current again. $MESSAGE"
          fi
