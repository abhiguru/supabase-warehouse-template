name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Container source dependency audit
        run: npm run check:container-dependencies
      - run: docker compose --env-file .env.example -f docker/docker-compose.yml -f docker/docker-compose.override.yml config --quiet
      - name: Shell syntax
        run: |
          for script in *.sh scripts/*.sh tests/*.sh; do bash -n "$script"; done
  migrations:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/migrations.sh
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: abhiguru/rn-warehouse-template
          # Reviewed source-demo companion; update deliberately with contract evidence.
          ref: c127ef622d84f50ba15eb2fb41609e703b82bfcc
          path: mobile
          persist-credentials: false
      - name: Record tested commit pair
        run: |
          git -C backend log -1 --format='Backend %H'
          git -C mobile log -1 --format='Mobile %H'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mobile
      - run: node scripts/check-mobile-contract.mjs ../mobile
        working-directory: backend

  secrets:
    name: Redacted source and history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/scan-secrets.sh

  demo-api:
    name: Isolated demo API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    env:
      WAREHOUSE_PROJECT_NAME: warehouse-ci-demo
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: abhiguru/rn-warehouse-template
          # Do not infer a branch in a different repository.
          ref: c127ef622d84f50ba15eb2fb41609e703b82bfcc
          path: mobile
          persist-credentials: false
      - name: Record tested commit pair
        run: |
          git -C backend log -1 --format='Backend %H'
          git -C mobile log -1 --format='Mobile %H'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: mobile
      - name: Fresh loopback demo
        run: bash setup.sh --demo
        working-directory: backend
      - run: npm run doctor
        working-directory: backend
      - name: Effective RPC signatures and grants
        run: node scripts/check-mobile-contract.mjs ../mobile --live
        working-directory: backend
      - run: npm run test:api
        working-directory: backend
      - name: Studio and metadata compatibility
        run: npm run test:studio
        working-directory: backend
      - name: Gateway CORS, payload and local TLS
        run: npm run test:gateway
        working-directory: backend
      - name: Gateway upstream IP replacement
        run: npm run test:gateway-dns
        working-directory: backend
      - name: Authenticated Realtime
        run: npm run test:realtime
        working-directory: backend
      - name: Retention dry run
        run: npm run retention:preview
        working-directory: backend
      - name: API and database load smoke
        run: npm run test:load
        working-directory: backend
      - name: Monitoring targets and local alert delivery
        run: npm run test:monitoring
        working-directory: backend
      - name: Backup and isolated restore drill
        run: |
          npm run db:backup -- /tmp/warehouse-ci-backup
          npm run db:verify-restore -- /tmp/warehouse-ci-backup
        working-directory: backend
      - name: Pooler session and transaction authentication
        run: npm run test:pooler
        working-directory: backend
      - name: CUPS startup without printer hardware
        run: npm run test:cups
        working-directory: backend
      - name: Owned-service recovery
        run: npm run test:recovery
        working-directory: backend
      - name: Preserve config and rerun setup
        run: |
          sha256sum docker/.env > /tmp/warehouse-config.sha256
          stat -c %a docker/.env > /tmp/warehouse-config.mode
          bash setup.sh --demo
          sha256sum -c /tmp/warehouse-config.sha256
          test "$(stat -c %a docker/.env)" = "$(cat /tmp/warehouse-config.mode)"
        working-directory: backend
      - name: Stop only this checkout's demo
        if: always()
        run: test ! -f docker/.env || bash scripts/compose.sh --profile '*' down
        working-directory: backend
