name: CI
on:
  # release/** : a backport to the previous minor line (CONTRIBUTING.md, "Releases") is tested like main: the tag's own release.yml runs
  # neither test:migrations nor the install and upgrade drills. The branches need the same ruleset as main (docs/PRODUCTION_DEPENDENCIES.md).
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  # Weekly, and on demand: docker/pdf-renderer/Dockerfile installs fonts and Chrome libraries from the live Debian mirrors, so the
  # golden pages can move with no change in the repository. A scheduled run executes every job, the renderer job always.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  # MOBILE_REF: the one app commit the contract job checks against, always a full SHA
  # (tests/workflows.test.mjs refuses anything else). What it is for and when to move it:
  # CONTRIBUTING.md, "Mobile companion pin".
  MOBILE_REF: ed1fae41864a744e90379616eec1721105b96899
# Where a job runs is the repository variable CI_RUNNER (a JSON value for runs-on, for example
# ["self-hosted","linux","x64","my-label"]); operator-install and operator-upgrade take OPERATOR_INSTALL_RUNNER instead. Without the
# variable, and always for a pull request from a fork, a job runs on a GitHub-hosted runner: code from a fork never
# runs on the project's own machine.
jobs:
  validate:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A change to a release branch carries no migration
        # Backports never carry a migration (CONTRIBUTING.md, "Releases"): a security fix that needs SQL ships as the next minor from
        # main. A file name that exists only on the release branch would strand the line, because the next minor does not contain it.
        if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- migrations/)"
          if [ -n "$changed" ]; then
            echo "::error title=Backports never carry a migration::A pull request into $BASE_REF changes migrations/. A security fix that needs SQL ships as the next minor release from main; the previous line's release note then tells its operators to upgrade."
            echo "$changed"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Dependency advisories this change adds (docker/storage, docker/pdf-renderer)
        # Owner decision of 2026-10-26: the live `npm audit` of the two frozen npm trees is not a gate any more; an advisory
        # published after the last merge turned every pull request red (2026-10-24). This step fails when the change adds
        # a HIGH or CRITICAL advisory that the base commit's trees did not have and docker/npm-audit-exceptions.json does not
        # cover, when that ledger is invalid, and when the audit cannot be read (the registry, the base commit, a tree left
        # without its lock): an unread audit is never a pass. A change that leaves both trees' manifests alone passes whatever
        # has been published since; the weekly dependency-audit.yml runs the live audit and opens the issue
        # (docs/CONTAINER_SECURITY.md, "Dependency advisory exceptions").
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/audit-compare.mjs --base-ref "$BASE_SHA"
  migrations:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: bash tests/migrations.sh
  migration-order:
    name: Migration ordering rule
    # CONTRIBUTING.md, "Migrations": never remove, rename or edit a file in migrations/, and never add one that sorts before an existing
    # one. The base is the branch tip a pull request merges into (the checkout is the merge of the two, so a file that main gained meanwhile
    # is part of both and a new file numbered below it is found), or the commit a push replaces. Its own job, so that a change to the
    # validate job does not collide with it.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Compare migrations/ with the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] && [ "${GITHUB_EVENT_NAME}" = push ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice title=Migration ordering rule not checked::There is no base commit to compare with (a scheduled or manual run, a new branch or a forced push)."
            exit 0
          fi
          node scripts/check-migration-order.mjs "$base"
  bridge:
    name: Sensor bridge unit tests
    # docker/sensor-bridge (GPL-3.0-or-later): the Python package and its tests
    # with the pinned requirements, without Docker or hubs. The image itself is
    # built and checked by `npm run test:sensors` in operator-install.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: 'pip install --require-hashes --only-binary=:all: -r docker/sensor-bridge/requirements.txt'
      - run: python -m compileall -q docker/sensor-bridge/sensor_bridge
      - run: python -m unittest discover -s docker/sensor-bridge/tests -t docker/sensor-bridge
  # Which parts of the change need the renderer jobs. A plain git diff (no third-party action): a push or pull request that
  # touches the renderer, its golden pages, the shared function code (the document and report HTML templates live in
  # functions/_shared and move the golden output) or this workflow runs them. Where the base cannot be read, they run.
  changes:
    name: Which jobs this change needs
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    outputs:
      renderer: ${{ steps.filter.outputs.renderer }}
      storage: ${{ steps.filter.outputs.storage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          renderer=true
          storage=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git diff --name-only "$BASE" HEAD | grep -Eq '^(docker/pdf-renderer/|tests/golden-pdf/|functions/_shared/|\.github/workflows/ci\.yml$)'; then renderer=true; else renderer=false; fi
            if git diff --name-only "$BASE" HEAD | grep -Eq '^(docker/storage/|docker/volumes/db/|docker/postgres/|docker/docker-compose\.yml$|scripts/baseline/lib\.sh$|scripts/db-image\.sh$|tests/storage-drill\.sh$|\.github/workflows/ci\.yml$)'; then storage=true; else storage=false; fi
          fi
          echo "renderer=$renderer" >> "$GITHUB_OUTPUT"
          echo "storage=$storage" >> "$GITHUB_OUTPUT"
  storage-drill:
    name: Storage drill (seeded catalog, current image, then the next minor)
    # tests/storage-drill.sh, the rehearsal that docker/storage/README.md ("The quarterly move") requires before the Storage image moves:
    # 5000 fictional objects, the current image applied and read through the API, then the next tag of the same major with the freeze
    # still set and then lifted. The current-image part must pass. The next-minor part only WARNS (continues, with a warning annotation)
    # while no tag is chosen: it then rehearses the newest tag on Docker Hub. Once the repository variable STORAGE_NEXT_TAG names the tag
    # of the coming quarterly move (for example v1.84.28), that move must pass the drill. Not a required check; it runs weekly, on demand,
    # and when a change touches docker/storage, the compose file, the database image and bootstrap, the drill or this workflow.
    needs: [validate, changes]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.storage == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Rehearse the Storage move on a seeded catalog
        env:
          STORAGE_DRILL_OBJECTS: '5000'
          STORAGE_NEXT_TAG: ${{ vars.STORAGE_NEXT_TAG }}
          STORAGE_DRILL_NEXT_REQUIRED: ${{ vars.STORAGE_NEXT_TAG != '' && 'true' || 'false' }}
        run: bash tests/storage-drill.sh
  pdf-renderer:
    name: PDF renderer unit tests, integration and golden pages
    # docker/pdf-renderer: the unit tests run on a fake browser (no Chrome needed); the image is built once, then
    # test/integration.sh (IMAGE=) runs it with the hardening flags of docker/docker-compose.yml (read-only root,
    # tmpfs /tmp, no capabilities, no-new-privileges, 512 pids, 1.5 GiB memory without swap) and checks health, a real
    # render, blocked network access and the 400/413 cases. Then each case of tests/golden-pdf/corpus is rendered by the
    # same image, rasterised at 150 dpi in a poppler container built from a fixed Debian snapshot (tests/golden-pdf/Dockerfile)
    # and compared page by page by decoded pixels (fuzz 0) with tests/golden-pdf/golden; what moved is uploaded as an artifact.
    # Regenerate with `run.sh --update` and review what moved. Skipped (not required, so never pending) when `changes` says
    # the change cannot move the renderer.
    needs: [validate, changes]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.renderer == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: docker/pdf-renderer
      - run: node --test test/*.test.mjs
        working-directory: docker/pdf-renderer
      - name: Build the renderer image once
        run: docker build -t pdf-renderer:ci docker/pdf-renderer
      - run: IMAGE=pdf-renderer:ci bash docker/pdf-renderer/test/integration.sh
      - name: Start the image with the hardening flags
        run: |
          docker run -d --name pdf-renderer-golden -p 127.0.0.1:3000:3000 --read-only --tmpfs /tmp:size=256m \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 512 --memory 1536m --memory-swap 1536m \
            pdf-renderer:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && exit 0; sleep 2; done
          docker logs pdf-renderer-golden >&2; exit 1
      - name: Render the corpus, rasterise in the pinned poppler container and compare
        run: RENDERER_URL=http://127.0.0.1:3000 bash tests/golden-pdf/run.sh
      - name: Pages that moved (new, golden, diff)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-pdf-failures
          path: tests/golden-pdf/failures
          if-no-files-found: ignore
      - name: Stop only this job's renderer
        if: always()
        run: docker rm -f pdf-renderer-golden
  contract:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abhiguru/rn-warehouse-template
          # Operator mobile companion, pinned to the tested commit.
          ref: ${{ env.MOBILE_REF }}
          path: mobile
          persist-credentials: false
      - name: Record tested commit pair
        run: |
          git -C backend log -1 --format='Backend %H'
          git -C mobile log -1 --format='Mobile %H'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mobile
      - run: node scripts/check-mobile-contract.mjs ../mobile
        working-directory: backend
      # With MOBILE_CHECKOUT set, tests/rpc-callers.test.mjs also compares the app's RPC names with tests/rpc_callers_exist.sql.
      - run: node --test tests/rpc-callers.test.mjs
        working-directory: backend
        env:
          MOBILE_CHECKOUT: ${{ github.workspace }}/mobile

  secrets:
    name: Redacted source and history scan
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/scan-secrets.sh

  operator-install:
    name: Isolated operator installation
    # A runner that keeps Docker's build cache between runs saves about
    # half the time: on a hosted runner about half of this job's time is image
    # builds from scratch (about 9.5 minutes with a warm cache). What such a runner must provide, and why it has to be
    # an isolated machine, is in docs/DEVELOPER_HANDOFF.md, "A self-hosted runner
    # for operator-install". This job is not a required check.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.OPERATOR_INSTALL_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend
      - name: Backup tools (rsync, and attr for the attribute checks)
        # Backups copy the stored files with rsync and keep their extended attributes; the restore drill reads them with
        # getfattr. The hosted runner image has rsync; a self-hosted runner must provide both (docs/DEVELOPER_HANDOFF.md).
        run: |
          if command -v rsync >/dev/null && command -v setfattr >/dev/null && command -v getfattr >/dev/null; then exit 0; fi
          if sudo -n true 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rsync attr
          else
            echo 'This runner needs the packages rsync and attr (docs/DEVELOPER_HANDOFF.md, "A self-hosted runner for operator-install").' >&2
            exit 1
          fi
      - name: Prepare private operator state
        run: |
          mkdir -m 700 "$RUNNER_TEMP/core-backend-test-20260929"
          echo "WAREHOUSE_STATE_DIR=$RUNNER_TEMP/core-backend-test-20260929" >> "$GITHUB_ENV"
      - name: Configure isolated gateway regression network
        run: |
          # An extra Compose file (scripts/compose.sh reads WAREHOUSE_COMPOSE_EXTRA): a fixed subnet for the default network.
          cat > "$RUNNER_TEMP/compose-subnet.yml" <<'YAML'
          networks:
            default:
              ipam:
                config:
                  - subnet: 10.233.245.0/24
          YAML
          echo "WAREHOUSE_COMPOSE_EXTRA=$RUNNER_TEMP/compose-subnet.yml" >> "$GITHUB_ENV"
        working-directory: backend
      - name: Fresh private operator configuration and local services
        run: |
          # The fixture sentinel (docs/OPERATOR_INSTALL.md, "Test installations"): the installer accepts
          # it only for this .example.test address, and the OTP function never sends with it. The
          # template text your-... is refused by the installer, so it cannot stand in here.
          install -m 600 /dev/null "$RUNNER_TEMP/msg91-ci.env"
          cat > "$RUNNER_TEMP/msg91-ci.env" <<'ENV'
          SMS_PROVIDER=msg91
          MSG91_AUTH_KEY=isolated-no-delivery-key
          MSG91_TEMPLATE_ID=000000000000000000000001
          MSG91_PE_ID=0000000000000000001
          MSG91_SENDER_ID=CITEST
          ENV
          bash setup.sh --operator --state-dir "$WAREHOUSE_STATE_DIR" \
            --api-url https://backend-core.example.test --company 'Fictional Core Warehouse' \
            --provider-env "$RUNNER_TEMP/msg91-ci.env" \
            --admin-phone 919888888871 --admin-name 'Core Demo Administrator' \
            --alert-webhook-file off \
            --letterhead-file off
        working-directory: backend
      - run: node scripts/doctor.mjs --local
        working-directory: backend
      - name: Per-role database logins after a fresh install
        # Each service login refuses POSTGRES_PASSWORD and accepts its own value over
        # a SCRAM-authenticated network connection (docs/CONTAINER_SECURITY.md).
        run: npm run test:db-roles
        working-directory: backend
      - name: Signing-key rotation, session revocation and rotated-instance health
        run: npm run test:rotation
        working-directory: backend
      - name: Database password rotation, service logins and then the superuser
        run: |
          npm run db:rotate-passwords -- --yes
          npm run test:db-roles
          npm run db:rotate-passwords -- --yes --superuser
          npm run test:db-roles
        working-directory: backend
      - name: Operator backend HTTP, documents and account lifecycle
        run: |
          node tests/operator-api-core.mjs
          node tests/operator-api-final.mjs
        working-directory: backend
      - name: Gateway CORS, payload, key check, rate limits and log
        run: npm run test:gateway
        working-directory: backend
      - name: API role statement timeouts (anon is cut at 3 s through PostgREST, service_role is not)
        run: npm run test:anon-timeout
        working-directory: backend
      - name: Gateway upstream IP replacement
        run: npm run test:gateway-dns
        working-directory: backend
      - name: Retention dry run
        run: npm run retention:preview
        working-directory: backend
      - name: API and database load smoke
        run: npm run test:load
        working-directory: backend
      - name: Monitoring checker (one pass and its status, no systemd timer)
        # The CI install has no Slack webhook (--alert-webhook-file off), so the pass records its state and posts
        # nothing. `run` never makes a backup (that is `watch.mjs daily`, which this job does not call; the backup steps
        # below make theirs). WAREHOUSE_WATCH_DAILY_AT must stay unset here: a `run` that sees it takes itself for the
        # checker unit of an installation from before the daily timer and makes the daily pass inside itself.
        # The pass must find the installation healthy: any check error or any down alert of the database, a service
        # or the gateway fails the step (host alerts such as disk, cpu and memory depend on the runner and do not).
        run: |
          unset WAREHOUSE_WATCH_DAILY_AT
          rm -f "$WAREHOUSE_STATE_DIR/config/watch-state.json"
          node scripts/watch.mjs run
          test -s "$WAREHOUSE_STATE_DIR/config/watch-state.json"
          node -e '
            const state = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const alerts = state.alerts || {};
            const bad = Object.entries(alerts).filter(([id, a]) => a.failingRuns > 0 && (id.startsWith("check_error:") || id.startsWith("service_down:") || id === "postgres_down" || id === "api_down"));
            if (bad.length) { console.error("Failing checks: " + bad.map(([id, a]) => id + " (" + a.summary + ": " + a.detail + ")").join("; ") + ". Alert ids in the state: " + (Object.keys(alerts).join(", ") || "none")); process.exit(1); }
          ' "$WAREHOUSE_STATE_DIR/config/watch-state.json"
          node scripts/watch.mjs status
        working-directory: backend
      - name: Backup
        run: |
          npm run db:backup -- /tmp/warehouse-ci-backup
          # Two backups in the default place: nothing was stored in between, so the second links every file to the first
          # (hard links, no new bytes), and the attributes that carry each file's content type are in the copy.
          npm run db:backup
          sleep 1
          npm run db:backup
          backups="$(ls -1d "$WAREHOUSE_STATE_DIR"/backups/warehouse-* | sort)"
          test "$(wc -l <<<"$backups")" -eq 2
          first="$(head -n 1 <<<"$backups")"; second="$(tail -n 1 <<<"$backups")"
          grep -qx 'link_base=none' "$first/metadata.txt"
          grep -qx "link_base=$(basename "$first")" "$second/metadata.txt"
          grep -qx 'storage_new_bytes=0' "$second/metadata.txt"
          grep -qx 'rot_repaired=0' "$second/metadata.txt"
          test "$(sed -n 's/^storage_files=//p' "$second/metadata.txt")" -ge 1
          test -z "$(find "$second/storage" -type f -links 1 -print -quit)"
          sample="$(cd "$second/storage" && find . -type f -print -quit)"
          test "$(stat -c %i "$first/storage/$sample")" = "$(stat -c %i "$second/storage/$sample")"
          sed -n 's/^\(stop_seconds\|duration_seconds\|storage_files\|storage_bytes\)=/\1 /p' "$second/metadata.txt"
          # A stored PDF carries its content type in the extended attribute the Storage service reads.
          pdf="$(cd "$second/storage" && grep -m1 -- '\.pdf/' <<<"$(find . -type f)" || true)"
          test -n "$pdf"
          test "$(getfattr -n user.supabase.content-type --only-values "$second/storage/$pdf")" = application/pdf
          npm run db:verify-restore -- "$second"
        working-directory: backend
      # restore.sh verifies the backup in an isolated database before it touches the instance.
      - name: In-place restore drill
        run: |
          bash stop.sh
          npm run db:restore -- --yes /tmp/warehouse-ci-backup
          bash start.sh
          node scripts/doctor.mjs --local
          bash scripts/compose.sh exec -T db psql -X -q -v ON_ERROR_STOP=1 -U supabase_admin -d postgres \
            < scripts/backup-integrity.sql > /tmp/warehouse-ci-restored-integrity.txt
          diff -u /tmp/warehouse-ci-backup/integrity.txt /tmp/warehouse-ci-restored-integrity.txt
          node tests/operator-api-restore.mjs /tmp/warehouse-ci-backup
          npm run test:db-roles
        working-directory: backend
      # scripts/storage-retag.sh runs scripts/retag-storage-metadata.cjs inside the storage container, with the module fs-xattr of the
      # image (the one the Storage service reads the attributes with). The unit tests stand that module in; this runs the real one.
      # The restored files belong to the runner user, so the host can take the attribute off them.
      - name: Content types set again from the catalog (real storage image)
        run: |
          stored="$WAREHOUSE_STATE_DIR/data/storage"
          pdf="$(cd "$stored" && grep -m1 -- '\.pdf/' <<<"$(find . -type f)" || true)"
          test -n "$pdf"
          test "$(getfattr -n user.supabase.content-type --only-values "$stored/$pdf")" = application/pdf
          # What a restore from an older backup or USB copy leaves: no content type on any file.
          find "$stored" -type f -exec setfattr -x user.supabase.content-type {} + 2>/dev/null || true
          if getfattr -n user.supabase.content-type --only-values "$stored/$pdf" 2>/dev/null; then echo 'the attribute is still there' >&2; exit 1; fi
          npm run storage:retag -- --if-missing | tee /tmp/warehouse-ci-retag.txt
          grep -q 'Some stored files have no content type' /tmp/warehouse-ci-retag.txt
          grep -Eq 'Storage metadata set from the catalog: [1-9][0-9]* files updated, [0-9]+ already correct, [0-9]+ catalogued but not on disk, [0-9]+ without catalog metadata, 0 errors\.' /tmp/warehouse-ci-retag.txt
          test "$(getfattr -n user.supabase.content-type --only-values "$stored/$pdf")" = application/pdf
          # Again: nothing is left to set, the look at a sample says so, and the plain run changes nothing.
          npm run storage:retag -- --if-missing | grep -q 'nothing to set'
          npm run storage:retag | grep -Eq 'Storage metadata set from the catalog: 0 files updated, .* 0 errors\.'
        working-directory: backend
      - name: Pooler session and transaction authentication
        run: |
          # The pooler is off by default: turn it on through the operator step, then check it.
          bash scripts/pooler.sh on
          npm run test:pooler
        working-directory: backend
      - name: CUPS startup without printer hardware
        run: npm run test:cups
        working-directory: backend
      - name: Sensor bridge image and configuration check without hubs
        run: npm run test:sensors
        working-directory: backend
      - name: Owned-service recovery
        run: npm run test:recovery
        working-directory: backend
      - name: Preserve config and rerun setup
        run: |
          sha256sum "$WAREHOUSE_STATE_DIR/config/compose.env" > /tmp/warehouse-config.sha256
          stat -c %a "$WAREHOUSE_STATE_DIR/config/compose.env" > /tmp/warehouse-config.mode
          bash setup.sh --operator --state-dir "$WAREHOUSE_STATE_DIR" \
            --api-url https://backend-core.example.test --company 'Fictional Core Warehouse' \
            --provider-env "$RUNNER_TEMP/msg91-ci.env" \
            --admin-phone 919888888871 --admin-name 'Core Demo Administrator' \
            --alert-webhook-file off \
            --letterhead-file off
          sha256sum -c /tmp/warehouse-config.sha256
          test "$(stat -c %a "$WAREHOUSE_STATE_DIR/config/compose.env")" = "$(cat /tmp/warehouse-config.mode)"
        working-directory: backend
      - name: Lost-host restore drill
        run: |
          # A placeholder tunnel credential (fictional values, never run) must travel with the backup.
          install -d -m 700 "$RUNNER_TEMP/tunnel-ci"
          tunnel_id=0b1c2d3e-4f50-4a6b-8c7d-9e0f1a2b3c4d
          printf '{"AccountTag":"ci","TunnelSecret":"not-a-secret","TunnelID":"%s","Endpoint":""}' "$tunnel_id" > "$RUNNER_TEMP/tunnel-ci/tunnel.json"
          printf 'tunnel: %s\ncredentials-file: %s\ningress:\n  - hostname: backend-core.example.test\n    service: http://127.0.0.1:18000\n  - service: http_status:404\n' \
            "$tunnel_id" "$RUNNER_TEMP/tunnel-ci/tunnel.json" > "$RUNNER_TEMP/tunnel-ci/config.yml"
          bash scripts/tunnel.sh adopt --config "$RUNNER_TEMP/tunnel-ci/config.yml"
          npm run db:backup -- /tmp/warehouse-ci-lost-host-backup
          # The operator's off-machine copy of the backup key: the lost-host restore refuses without it.
          install -m 600 "$WAREHOUSE_STATE_DIR/config/backup.key" "$RUNNER_TEMP/backup-key-copy"
          # The key escrow record (scripts/backup-key-escrow.sh): a USB drive is not enrolled and an encrypted archive is not written
          # until the operator has confirmed a copy of the key, and the whole copy is compared. No record yet; a copy with one wrong
          # character at the start (the end of the key right) is refused; the right copy is recorded.
          if bash scripts/backup-key-escrow.sh check; then echo 'a key copy counted as confirmed with no record' >&2; exit 1; fi
          key_copy="$(cat "$RUNNER_TEMP/backup-key-copy")"; first=a; if [ "${key_copy:0:1}" = a ]; then first=b; fi
          printf '%s%s\n' "$first" "${key_copy:1}" > "$RUNNER_TEMP/backup-key-miscopied"
          if bash scripts/backup-key-escrow.sh confirm --key-file "$RUNNER_TEMP/backup-key-miscopied"; then echo 'a mistaken key copy was accepted' >&2; exit 1; fi
          test ! -e "$WAREHOUSE_STATE_DIR/config/backup-key.escrow"
          bash scripts/backup-key-escrow.sh confirm --key-file "$RUNNER_TEMP/backup-key-copy"
          bash scripts/backup-key-escrow.sh check
          test "$(stat -c %a "$WAREHOUSE_STATE_DIR/config/backup-key.escrow")" = 600
          # What a USB drive holds: one encrypted archive of the backup, written with the functions backup-usb.sh uses, with the
          # checksum and signature files next to it. The drive is a folder here; the lost host gets nothing but this and the key copy.
          usb="$RUNNER_TEMP/usb-drive"; usb_name=warehouse-20260930T000000Z
          install -d -m 700 "$usb" "$RUNNER_TEMP/usb-source"
          cp -a /tmp/warehouse-ci-lost-host-backup "$RUNNER_TEMP/usb-source/$usb_name"
          (
            source scripts/backup-key.sh
            source scripts/backup-archive.sh
            backup_key_load "$RUNNER_TEMP/backup-key-copy"
            hash="$(backup_archive_write "$RUNNER_TEMP/usb-source/$usb_name" "$usb/$usb_name.tar.enc" encrypt)"
            printf '%s  %s\n' "$hash" "$usb_name.tar.enc" > "$usb/$usb_name.tar.enc.sha256"
            backup_sign_archive "$usb/$usb_name.tar.enc" "$BACKUP_KEY"
          )
          if grep -aq 'JWT_SECRET\|database.dump' "$usb/$usb_name.tar.enc"; then echo 'the archive on the drive is readable' >&2; exit 1; fi
          rm -rf "$RUNNER_TEMP/usb-source"
          bash scripts/data-fingerprint.sh > /tmp/warehouse-ci-fingerprint.txt
          # Lose the host: no containers of this installation remain;
          # only the backup is carried over. The old state stays where it is, unused.
          bash scripts/compose.sh --profile '*' down
          restored="$RUNNER_TEMP/core-backend-test-20260930"
          if npm run db:restore-host -- --state-dir "$restored" --yes /tmp/warehouse-ci-lost-host-backup; then
            echo 'restore-host accepted a backup without the backup key' >&2; exit 1
          fi
          test ! -e "$restored"
          # The encrypted archive cannot be opened without the key, nor with another one.
          if npm run db:restore-host -- --state-dir "$restored" --yes "$usb/$usb_name.tar.enc"; then
            echo 'restore-host accepted an encrypted archive without the backup key' >&2; exit 1
          fi
          openssl rand -hex 32 > "$RUNNER_TEMP/wrong-key"; chmod 600 "$RUNNER_TEMP/wrong-key"
          if npm run db:restore-host -- --state-dir "$restored" --backup-key "$RUNNER_TEMP/wrong-key" --yes "$usb/$usb_name.tar.enc"; then
            echo 'restore-host opened an encrypted archive with the wrong key' >&2; exit 1
          fi
          test ! -e "$restored"
          # The lost-host restore from the drive alone: the encrypted archive and the operator's copy of the key.
          npm run db:restore-host -- --state-dir "$restored" --backup-key "$RUNNER_TEMP/backup-key-copy" --yes "$usb/$usb_name.tar.enc"
          echo "WAREHOUSE_STATE_DIR=$restored" >> "$GITHUB_ENV"
          export WAREHOUSE_STATE_DIR="$restored"
          cmp "$RUNNER_TEMP/backup-key-copy" "$restored/config/backup.key"
          node scripts/doctor.mjs --local
          cmp "$RUNNER_TEMP/tunnel-ci/tunnel.json" "$restored/config/tunnel/credentials.json"
          grep -qx "credentials-file: $restored/config/tunnel/credentials.json" "$restored/config/tunnel/config.yml"
          bash scripts/tunnel.sh status > /tmp/warehouse-ci-tunnel-status.txt
          grep -q "locally managed tunnel $tunnel_id" /tmp/warehouse-ci-tunnel-status.txt
          bash scripts/data-fingerprint.sh | diff -u /tmp/warehouse-ci-fingerprint.txt -
          # --all must succeed on the restored stack and print more lines than the default.
          default_lines=$(wc -l < /tmp/warehouse-ci-fingerprint.txt)
          bash scripts/data-fingerprint.sh --all > /tmp/warehouse-ci-fingerprint-all.txt
          all_lines=$(wc -l < /tmp/warehouse-ci-fingerprint-all.txt)
          test "$all_lines" -gt "$default_lines"
          grep -q '^table storage.buckets rows=' /tmp/warehouse-ci-fingerprint-all.txt
          bash scripts/compose.sh exec -T db psql -X -q -v ON_ERROR_STOP=1 -U supabase_admin -d postgres \
            < scripts/backup-integrity.sql | diff -u /tmp/warehouse-ci-lost-host-backup/integrity.txt -
          # The restore is proven above. This backup was taken minutes after the earlier
          # steps signed the fictional customer in five times, and the restore faithfully
          # brings back its exhausted hourly OTP counter; clear it for the API check.
          bash scripts/compose.sh exec -T db psql -X -q -v ON_ERROR_STOP=1 -U supabase_admin -d postgres \
            -c "DELETE FROM public.otp_rate_limits WHERE phone_number = '919888888872'"
          node tests/operator-api-restore.mjs /tmp/warehouse-ci-lost-host-backup
          npm run test:db-roles
          # The pooler is off after a restore (the restore starts core services only) and _supabase is not in backups:
          # test:pooler turns it on itself (pooler.sh on) and checks it again.
          npm run test:pooler
        working-directory: backend
      - name: Retention removes an expired document through the Storage API
        run: |
          # The last step that uses the stack: it deletes a document, so nothing that reads
          # documents or compares fingerprints may come after it. One generated PDF is made
          # older than the generated_documents policy; retention:apply must then remove its
          # catalog row and its file through the real Storage API.
          query() { bash scripts/compose.sh exec -T db psql -X -qAt -v ON_ERROR_STOP=1 -U supabase_admin -d postgres -c "$1"; }
          stored() { bash scripts/compose.sh exec -T storage sh -c 'find "/var/lib/storage/stub/stub/documents/$1" -type f 2>/dev/null | wc -l' sh "$name"; }
          name="$(query "SELECT name FROM storage.objects WHERE bucket_id = 'documents' AND name LIKE '%.pdf' ORDER BY created_at, name LIMIT 1")"
          test -n "$name"
          query "UPDATE storage.objects SET created_at = now() - interval '400 days' WHERE bucket_id = 'documents' AND name = '$name'"
          test "$(query "SELECT count(*) FROM warehouse_maintenance.expired_generated_documents(now())")" = 1
          test "$(stored)" -ge 1
          npm run retention:apply
          test "$(query "SELECT count(*) FROM storage.objects WHERE bucket_id = 'documents' AND name = '$name'")" = 0
          test "$(stored)" -eq 0
        working-directory: backend
      - name: Stop only this checkout's operator project
        if: always()
        run: test ! -f "$WAREHOUSE_STATE_DIR/config/compose.env" || bash scripts/compose.sh --profile '*' down
        working-directory: backend

  operator-upgrade:
    name: Upgrade from the previous release
    # The operator's upgrade path (upgrade.sh): install what scripts/ci-previous-tag.sh chooses, then move that installation to this
    # commit with `upgrade.sh --ref` (a commit is not a release tag, so --ref is the only way in CI), and check that it is healthy and
    # still the same facility, with no table that lost rows. The starting point is the newest release tag before this change on the
    # same PostgreSQL major, and that tag's own upgrade.sh runs, unchanged: it is the script operators of that release run. Where no
    # tag can start the drill (none yet, or a tag on another major, which is the separate "Major PostgreSQL upgrade" procedure) it
    # starts from the merge base with the target branch (the commit before it on a push), with this change's upgrade.sh added, so the
    # drill runs on every change and also proves that the change applies on top of an installation of the branch. It skips, with a
    # notice, only when not even that commit can start it. It runs in parallel with the install drills, not inside them: its own state,
    # project and checkout. The runner is chosen like operator-install's, and the job is not a required check.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.OPERATOR_INSTALL_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: backend
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Choose the starting point
        id: previous
        env:
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: bash scripts/ci-previous-tag.sh "$BASE_BRANCH" | tee -a "$GITHUB_OUTPUT"
        working-directory: backend
      - name: Upgrade drill skipped
        if: steps.previous.outputs.skip == 'true'
        env:
          REASON: ${{ steps.previous.outputs.reason }}
        run: echo "::notice title=Upgrade drill skipped::$REASON"
      - name: Upgrade drill starts from a commit
        if: steps.previous.outputs.kind == 'merge-base'
        env:
          NOTE: ${{ steps.previous.outputs.note }}
        run: echo "::notice title=Upgrade drill starts from the merge base::$NOTE"
      - name: Install the previous release
        if: steps.previous.outputs.skip != 'true'
        env:
          PREVIOUS_REF: ${{ steps.previous.outputs.ref }}
          PREVIOUS_KIND: ${{ steps.previous.outputs.kind }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/previous"
          # A persistent runner keeps the registration of an earlier run's worktree after RUNNER_TEMP was wiped.
          git -C backend worktree prune
          git -C backend worktree add --detach "$previous" "$PREVIOUS_REF"
          # A release that has upgrade.sh and pg-major.sh runs its own, unchanged: the script operators of that release run. A merge
          # base, or a tag from before them, gets this change's copies as one local commit (so the tree is clean, as upgrade.sh requires).
          if [ "$PREVIOUS_KIND" = tag ] && git -C "$previous" cat-file -e HEAD:upgrade.sh 2>/dev/null && git -C "$previous" cat-file -e HEAD:scripts/pg-major.sh 2>/dev/null; then
            echo "The drill runs the upgrade.sh of $PREVIOUS_REF, unchanged."
          else
            echo "The drill adds the upgrade.sh and pg-major.sh of the change under test to $PREVIOUS_REF (with the three helpers upgrade.sh sources and calls)."
            cp backend/upgrade.sh "$previous/upgrade.sh"
            cp backend/scripts/pg-major.sh backend/scripts/upgrade-lib.sh backend/scripts/pre-images.sh backend/scripts/maintenance.sh "$previous/scripts/"
            git -C "$previous" add upgrade.sh scripts/pg-major.sh scripts/upgrade-lib.sh scripts/pre-images.sh scripts/maintenance.sh
            if ! git -C "$previous" diff --cached --quiet; then
              git -C "$previous" -c user.name=ci -c user.email=ci@example.invalid commit -q -m 'CI: upgrade.sh and its helpers of the change under test'
            fi
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/msg91-upgrade.env"
          cat > "$RUNNER_TEMP/msg91-upgrade.env" <<'ENV'
          SMS_PROVIDER=msg91
          MSG91_AUTH_KEY=isolated-no-delivery-key
          MSG91_TEMPLATE_ID=000000000000000000000001
          MSG91_PE_ID=0000000000000000001
          MSG91_SENDER_ID=CITEST
          ENV
          state="$RUNNER_TEMP/core-backend-test-20261026"   # the operator-api fixtures only accept this name pattern
          mkdir -m 700 "$state"
          echo "WAREHOUSE_STATE_DIR=$state" >> "$GITHUB_ENV"
          export WAREHOUSE_STATE_DIR="$state"
          # The options that release's setup.sh knows: one from before the Slack and letterhead questions has neither.
          options=()
          if grep -q -- '--alert-webhook-file' "$previous/setup.sh"; then options+=(--alert-webhook-file off); fi
          if grep -q -- '--letterhead-file' "$previous/setup.sh"; then options+=(--letterhead-file off); fi
          cd "$previous"
          bash setup.sh --operator --state-dir "$state" \
            --api-url https://backend-core.example.test --company 'Fictional Core Warehouse' \
            --provider-env "$RUNNER_TEMP/msg91-upgrade.env" \
            --admin-phone 919888888871 --admin-name 'Core Demo Administrator' \
            "${options[@]}"
          node scripts/doctor.mjs --local
          node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).instanceId' "$state/public/instance.json" > "$RUNNER_TEMP/instance-before"
          bash scripts/compose.sh exec -T db psql -X -qAt -U supabase_admin -d postgres \
            -c "SELECT mobile FROM public.user_profiles WHERE role = 'admin' ORDER BY created_at" > "$RUNNER_TEMP/admins-before"
          test "$(cat "$RUNNER_TEMP/admins-before")" = 919888888871
          # Row counts of every business table, to compare after the move (a release before --counts has none to compare).
          if grep -q -- '--counts' scripts/data-fingerprint.sh; then bash scripts/data-fingerprint.sh --counts > "$RUNNER_TEMP/counts-before"; fi
      - name: Upgrade to this commit with upgrade.sh
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ref="$(git -C "$GITHUB_WORKSPACE/backend" rev-parse HEAD)"
          cd "$RUNNER_TEMP/previous"
          before="$(git rev-parse HEAD)"
          # A dry run runs the checks and the plan and changes nothing.
          bash upgrade.sh --dry-run --ref "$ref"
          test "$(git rev-parse HEAD)" = "$before"
          test ! -e "$WAREHOUSE_STATE_DIR/config/upgrades.log"
          test ! -e "$WAREHOUSE_STATE_DIR/config/upgrade-in-progress"
          # The write freeze (maintenance mode), when the upgrade.sh that runs has it: a release tag from before it runs its own script, unchanged, and
          # closes nothing. Then (1) a psql session from outside the stack, which is how fas-sync reaches the database, makes the run refuse before it
          # changes anything, and (2) while the upgrade runs, a request to the API (the anon-callable get_public_config RPC, through the loopback
          # gateway the tunnel uses) is answered 503 "upgrading" at least once, and after it the route answers normally.
          freeze=no
          if grep -q 'scripts/maintenance.sh' upgrade.sh; then freeze=yes; fi
          port="$(bash scripts/compose.sh port gateway 8000 | head -n 1 | sed 's/.*://')"
          anon="$(sed -n 's/^ANON_KEY=//p' "$WAREHOUSE_STATE_DIR/config/compose.env")"
          rpc() { curl -s -o "$RUNNER_TEMP/rpc-body" -w '%{http_code}' -X POST -H "apikey: $anon" -H 'Content-Type: application/json' -d '{"p_environment":"production"}' "http://127.0.0.1:$port/rest/v1/rpc/get_public_config" || true; }
          if [ "$freeze" = yes ]; then
            test "$(rpc)" != 503
            bash scripts/compose.sh exec -T db psql -X -q -U supabase_admin -d postgres -c 'SELECT pg_sleep(600)' &
            session=$!
            # upgrade.sh looks for the session after its own checks: wait until it is visible, so that a slow runner cannot make the run go ahead.
            seen=no
            for _ in $(seq 1 60); do
              if [ "$(bash scripts/compose.sh exec -T db psql -X -qAt -U supabase_admin -d postgres -c "SELECT count(*) FROM pg_stat_activity WHERE application_name = 'psql' AND query LIKE '%pg_sleep(600)%' AND query NOT LIKE '%pg_stat_activity%'")" -ge 1 ]; then seen=yes; break; fi
              sleep 1
            done
            [ "$seen" = yes ] || { echo "::error::the psql session never appeared in pg_stat_activity"; exit 1; }
            if bash upgrade.sh --ref "$ref" > "$RUNNER_TEMP/refused.log" 2>&1; then cat "$RUNNER_TEMP/refused.log"; echo "::error::upgrade.sh started while a psql session was open on the database"; exit 1; fi
            cat "$RUNNER_TEMP/refused.log"
            grep -q 'That is a psql session on the database from outside the stack' "$RUNNER_TEMP/refused.log"
            grep -q 'Nothing was changed' "$RUNNER_TEMP/refused.log"
            test "$(git rev-parse HEAD)" = "$before"
            test ! -e "$WAREHOUSE_STATE_DIR/config/upgrade-in-progress"
            test ! -e "$WAREHOUSE_STATE_DIR/config/maintenance"
            test "$(rpc)" != 503
            # End the session on purpose (it would run for ten minutes).
            bash scripts/compose.sh exec -T db psql -X -qAt -U supabase_admin -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE query LIKE '%pg_sleep(600)%' AND query NOT LIKE '%pg_stat_activity%'" > /dev/null
            kill "$session" 2>/dev/null || true
            wait "$session" 2>/dev/null || true
            : > "$RUNNER_TEMP/freeze-probe.log"
            ( while :; do printf '%s %s\n' "$(rpc)" "$(head -c 200 "$RUNNER_TEMP/rpc-body" | tr '\n' ' ')" >> "$RUNNER_TEMP/freeze-probe.log"; sleep 0.25; done ) &
            probe=$!
            trap 'kill "$probe" 2>/dev/null || true' EXIT
          else
            echo "::notice title=Write freeze not exercised::The upgrade.sh of $(git rev-parse --short HEAD) does not close the API (a release from before maintenance mode); the drill checks it once the starting point has it."
          fi
          bash upgrade.sh --ref "$ref"
          test "$(git rev-parse HEAD)" = "$ref"
          tail -n 1 "$WAREHOUSE_STATE_DIR/config/upgrades.log" | grep -q ' ok$'
          # A finished upgrade leaves no record of an interrupted one, and no marker: the API is open.
          test ! -e "$WAREHOUSE_STATE_DIR/config/upgrade-in-progress"
          test ! -e "$WAREHOUSE_STATE_DIR/config/maintenance"
          if [ "$freeze" = yes ]; then
            kill "$probe" 2>/dev/null || true
            sort "$RUNNER_TEMP/freeze-probe.log" | uniq -c | sort -rn | head -n 10
            grep -q '^503 {"code":"upgrading","message":"The facility.s server is being updated. Try again in a few minutes."}' "$RUNNER_TEMP/freeze-probe.log"
            test "$(rpc)" = 200
          fi
      - name: The upgraded installation is healthy and the same facility
        if: steps.previous.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/previous"
          npm ci
          node scripts/doctor.mjs --local
          test "$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).instanceId' "$WAREHOUSE_STATE_DIR/public/instance.json")" = "$(cat "$RUNNER_TEMP/instance-before")"
          bash scripts/compose.sh exec -T db psql -X -qAt -U supabase_admin -d postgres \
            -c "SELECT mobile FROM public.user_profiles WHERE role = 'admin' ORDER BY created_at" | diff -u "$RUNNER_TEMP/admins-before" -
          # No table that existed before the move has fewer rows after it (a migration may add tables and seed rows).
          if test -s "$RUNNER_TEMP/counts-before"; then
            bash scripts/data-fingerprint.sh --counts > "$RUNNER_TEMP/counts-after"
            test -s "$RUNNER_TEMP/counts-after"
            awk 'NR == FNR { before[$1] = $2; next } ($1 in before) && $2 + 0 < before[$1] + 0 { print "rows lost in " $1 ": " before[$1] " -> " $2; lost = 1 } END { exit lost }' "$RUNNER_TEMP/counts-before" "$RUNNER_TEMP/counts-after"
          fi
          npm run test:db-roles
          node tests/operator-api-core.mjs
      - name: Stop only the drill installation
        if: always() && steps.previous.outputs.skip != 'true'
        run: |
          cd "$RUNNER_TEMP/previous" || exit 0
          test -z "${WAREHOUSE_STATE_DIR:-}" || test ! -f "$WAREHOUSE_STATE_DIR/config/compose.env" || bash scripts/compose.sh --profile '*' down

  seeded-upgrade:
    name: Seeded upgrade (${{ matrix.variant }})
    # The upgrade drill with a facility that has data (tests/seed/make-seed.mjs: 8 customers, 300 receipts, 200 dispatches, 40 invoices,
    # 3 orders and 6 photos), run weekly and on demand, never on a pull request and not a required check. It starts where operator-upgrade
    # starts (scripts/ci-previous-tag.sh): the newest release tag of this PostgreSQL major, and until a tag exists on this line, the merge
    # base with the branch (the commit before HEAD on the branch itself), with this commit's upgrade.sh and helpers added.
    #   plain  loads the seed, takes a backup and proves it (what upgrade.sh does before a move, and what the target's preflight rehearses
    #          the migrations on), moves to this commit with upgrade.sh --ref, and checks that the rehearsal ran and that the rows of the
    #          seeded tables and the stored photos are as they were.
    #   clash  makes the database look like one on an earlier release (migration 117's unique customer-name index, its function and its
    #          ledger row removed), loads the seed with two customers whose names differ only in capitals and spaces, takes the backup,
    #          and runs upgrade.sh --ref: it must be refused before the checkout with migration 117 named, and the facility's database,
    #          checkout and upgrade record must be exactly as they were.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.OPERATOR_INSTALL_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 75
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, clash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: backend
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Choose the starting point
        id: previous
        env:
          BASE_BRANCH: ${{ github.ref_name }}
        run: bash scripts/ci-previous-tag.sh "$BASE_BRANCH" | tee -a "$GITHUB_OUTPUT"
        working-directory: backend
      - name: Seeded upgrade skipped
        if: steps.previous.outputs.skip == 'true'
        env:
          REASON: ${{ steps.previous.outputs.reason }}
        run: echo "::notice title=Seeded upgrade skipped::$REASON"
      - name: Install the previous release and load the seed
        if: steps.previous.outputs.skip != 'true'
        env:
          PREVIOUS_REF: ${{ steps.previous.outputs.ref }}
          PREVIOUS_KIND: ${{ steps.previous.outputs.kind }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/previous"
          git -C backend worktree prune
          git -C backend worktree add --detach "$previous" "$PREVIOUS_REF"
          if [ "$PREVIOUS_KIND" = tag ] && git -C "$previous" cat-file -e HEAD:upgrade.sh 2>/dev/null && git -C "$previous" cat-file -e HEAD:scripts/pg-major.sh 2>/dev/null; then
            echo "The drill runs the upgrade.sh of $PREVIOUS_REF, unchanged."
          else
            echo "The drill adds the upgrade.sh and pg-major.sh of the change under test to $PREVIOUS_REF (with the two helpers upgrade.sh sources and calls)."
            cp backend/upgrade.sh "$previous/upgrade.sh"
            cp backend/scripts/pg-major.sh backend/scripts/upgrade-lib.sh backend/scripts/pre-images.sh "$previous/scripts/"
            git -C "$previous" add upgrade.sh scripts/pg-major.sh scripts/upgrade-lib.sh scripts/pre-images.sh
            if ! git -C "$previous" diff --cached --quiet; then
              git -C "$previous" -c user.name=ci -c user.email=ci@example.invalid commit -q -m 'CI: upgrade.sh and its helpers of the change under test'
            fi
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/msg91-upgrade.env"
          cat > "$RUNNER_TEMP/msg91-upgrade.env" <<'ENV'
          SMS_PROVIDER=msg91
          MSG91_AUTH_KEY=isolated-no-delivery-key
          MSG91_TEMPLATE_ID=000000000000000000000001
          MSG91_PE_ID=0000000000000000001
          MSG91_SENDER_ID=CITEST
          ENV
          state="$RUNNER_TEMP/core-backend-test-20261027"   # the operator-api fixtures only accept this name pattern
          mkdir -m 700 "$state"
          echo "WAREHOUSE_STATE_DIR=$state" >> "$GITHUB_ENV"
          export WAREHOUSE_STATE_DIR="$state"
          # The options that release's setup.sh knows: one from before the Slack and letterhead questions has neither.
          options=()
          for option in --alert-webhook-file --letterhead-file; do
            if grep -q -- "$option" "$previous/setup.sh"; then options+=("$option" off); fi
          done
          cd "$previous"
          bash setup.sh --operator --state-dir "$state" \
            --api-url https://backend-seeded.example.test --company 'Fictional Seeded Warehouse' \
            --provider-env "$RUNNER_TEMP/msg91-upgrade.env" \
            --admin-phone 919888888872 --admin-name 'Seeded Demo Administrator' \
            "${options[@]}"
          query() { bash scripts/compose.sh exec -T db psql -X -qAt -v ON_ERROR_STOP=1 -U supabase_admin -d postgres "$@"; }
          if [ "$VARIANT" = clash ]; then
            # A facility on an earlier release: no unique index over the normalised customer name yet (migration 117), so that two
            # names which differ only in capitals and spaces were accepted. The function and the ledger row go with it, as 117 recreates both.
            query -c "DROP INDEX public.customers_name_norm_key; DROP FUNCTION utils.customer_name_key(text); DELETE FROM warehouse_migrations.applied WHERE name LIKE '00000000000117\_%'"
          fi
          node "$GITHUB_WORKSPACE/backend/tests/seed/make-seed.mjs" $([ "$VARIANT" = clash ] && echo --clash) --photos "$RUNNER_TEMP/seed-photos" > "$RUNNER_TEMP/seed.sql"
          query < "$RUNNER_TEMP/seed.sql"
          bash scripts/compose.sh cp "$RUNNER_TEMP/seed-photos/stub" storage:/var/lib/storage/
          test "$(bash scripts/compose.sh exec -T storage sh -c 'find /var/lib/storage/stub/stub/grn-images /var/lib/storage/stub/stub/dispatch-images -type f | wc -l')" = 6
          # What upgrade.sh does first, by hand: a backup, proved, and on the list of verified ones, which is what the target's
          # preflight rehearses the migrations on (the first move of a facility has none, and says so).
          if grep -q 'record-verified' scripts/watch.mjs; then
            bash scripts/backup.sh | tee "$RUNNER_TEMP/backup.out"
            backup="$(sed -n 's/^Backup created at \(\/.*\)$/\1/p' "$RUNNER_TEMP/backup.out" | tail -n 1)"
            test -d "$backup"
            bash scripts/verify-restore.sh "$backup"
            node scripts/watch.mjs record-verified "$backup" 1 > /dev/null
          fi
          bash scripts/data-fingerprint.sh --counts > "$RUNNER_TEMP/counts-before"
          bash scripts/data-fingerprint.sh > "$RUNNER_TEMP/fingerprint-before"
          git rev-parse HEAD > "$RUNNER_TEMP/head-before"
      - name: Upgrade to this commit and check the rows
        if: steps.previous.outputs.skip != 'true'
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          ref="$(git -C "$GITHUB_WORKSPACE/backend" rev-parse HEAD)"
          cd "$RUNNER_TEMP/previous"
          rehearsal=no
          if git cat-file -e "$ref:scripts/upgrade-rehearse.sh" 2>/dev/null && grep -q 'upgrade-preflight' upgrade.sh && grep -q 'record-verified' scripts/watch.mjs; then rehearsal=yes; fi
          if [ "$VARIANT" = clash ]; then
            test "$rehearsal" = yes   # the starting point must be able to run the rehearsal, or this variant proves nothing
            # The dry run refuses too: the rehearsal is part of it, and it changes nothing.
            if bash upgrade.sh --dry-run --ref "$ref" > "$RUNNER_TEMP/dry.out" 2>&1; then echo "The dry run accepted a clashing customer name."; exit 1; fi
            if bash upgrade.sh --ref "$ref" > "$RUNNER_TEMP/upgrade.out" 2>&1; then echo "The upgrade accepted a clashing customer name."; exit 1; fi
            for out in dry upgrade; do
              grep -q '00000000000117_customer_name_rule.sql' "$RUNNER_TEMP/$out.out"
              grep -q 'Nothing was changed' "$RUNNER_TEMP/$out.out"
              # The reason must be the unique index over the clashing names, not any other failure of 117.
              grep -q 'customers_name_norm_key' "$RUNNER_TEMP/$out.out"
            done
            test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/head-before")"
            test ! -e "$WAREHOUSE_STATE_DIR/config/upgrade-in-progress"
            bash scripts/data-fingerprint.sh | diff -u "$RUNNER_TEMP/fingerprint-before" -
            bash scripts/data-fingerprint.sh --counts | diff -u "$RUNNER_TEMP/counts-before" -
            exit 0
          fi
          bash upgrade.sh --dry-run --ref "$ref" | tee "$RUNNER_TEMP/dry.out"
          bash upgrade.sh --ref "$ref" | tee "$RUNNER_TEMP/upgrade.out"
          test "$(git rev-parse HEAD)" = "$ref"
          tail -n 1 "$WAREHOUSE_STATE_DIR/config/upgrades.log" | grep -q ' ok$'
          if [ "$rehearsal" = yes ]; then
            grep -q 'Rehearsal of the migrations: passed' "$RUNNER_TEMP/dry.out"
            grep -q 'Rehearsal of the migrations: passed' "$RUNNER_TEMP/upgrade.out"
          fi
          npm ci
          bash scripts/data-fingerprint.sh --counts > "$RUNNER_TEMP/counts-after"
          # The seeded tables keep exactly their rows (a migration may add tables and seed other rows).
          for table in customers goodsreceived goodsreceived_trl dispatch dispatch_trl invoice invoice_trl orders order_items grn_images dispatch_images; do
            test "$(grep "^public.$table " "$RUNNER_TEMP/counts-before")" = "$(grep "^public.$table " "$RUNNER_TEMP/counts-after")"
          done
          test "$(grep '^storage.objects ' "$RUNNER_TEMP/counts-before")" = "$(grep '^storage.objects ' "$RUNNER_TEMP/counts-after")"
          test "$(bash scripts/compose.sh exec -T storage sh -c 'find /var/lib/storage/stub/stub/grn-images /var/lib/storage/stub/stub/dispatch-images -type f | wc -l')" = 6
          node scripts/doctor.mjs --local
      - name: Stop only the drill installation
        if: always() && steps.previous.outputs.skip != 'true'
        run: |
          cd "$RUNNER_TEMP/previous" || exit 0
          test -z "${WAREHOUSE_STATE_DIR:-}" || test ! -f "$WAREHOUSE_STATE_DIR/config/compose.env" || bash scripts/compose.sh --profile '*' down
