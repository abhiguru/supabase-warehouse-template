name: Dependency advisories

# The two frozen npm trees (docker/storage, the dependency set of the pinned Storage release, and docker/pdf-renderer) are
# audited live here, once a week, and no longer in the required pull-request check: an advisory published after the last merge
# used to turn every pull request red until the lock was rebuilt (2026-10-24). A pull request now fails only when it adds an
# advisory itself (scripts/audit-compare.mjs --base-ref, in ci.yml). This workflow runs `scripts/audit-compare.mjs --live`:
# HIGH and CRITICAL advisories of production dependencies that no valid, unexpired entry of docker/npm-audit-exceptions.json
# covers, expired exceptions, and exceptions that expire within 14 days. It then opens or updates ONE issue ("Dependency
# advisories, <date>") and closes it when the audit is clean. An edit sends no notification, and this issue is the only signal
# for an advisory published after the last merge, so when the issue is already open and a finding line is new (an advisory, an
# expiry, a lapsed exception that the issue did not list), the run first adds ONE comment that lists only the new lines. A week
# with nothing new edits the body silently: no comment and no e-mail every week.
# A finding never fails the run: only a failure of the check itself (the registry unreadable) does.
on:
  schedule:
    - cron: '29 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A manual run next to the scheduled one must not open a second issue: the issue search can lag behind a just-created issue.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Audit both trees against the exception ledger
        id: audit
        run: |
          set +e
          node scripts/audit-compare.mjs --live --report "$RUNNER_TEMP/advisories.md"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Status 1 is a finding, handled by the next step. Status 2 is a failure of the check itself (the audit could not
          # be read); it fails the run and neither opens nor closes an issue.
          [[ "$status" != 2 ]] || exit 2
          # Any other status but 0 (137: the process was killed) is no result either: never "clean".
          [[ "$status" == 0 || "$status" == 1 ]] || { echo "::error title=Dependency audit failed::scripts/audit-compare.mjs exited with status $status."; exit 1; }
      - name: Open or update the issue, or close it when the audit is clean
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.audit.outputs.status }}
        run: |
          # Only 0 (clean) and 1 (findings) are results; anything else must never read as "clean" and close the issue.
          if [[ "$STATUS" != 0 && "$STATUS" != 1 ]]; then
            echo "::error title=Dependency audit failed::scripts/audit-compare.mjs exited with status $STATUS, so there is no result. The issue is left as it is."
            exit 1
          fi
          title="Dependency advisories, $(date -u +%F)"
          # Only this workflow's own issue (the repository is public: anyone can open one with a title like it).
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --author app/github-actions --state open --search '"Dependency advisories" in:title' --json number,title --jq 'map(select(.title | startswith("Dependency advisories,"))) | .[0].number // empty')
          if [[ "$STATUS" == 1 ]]; then
            {
              cat "$RUNNER_TEMP/advisories.md"
              printf '\n\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } > "$RUNNER_TEMP/issue-body.md"
            if [[ -n "$number" ]]; then
              # A finding line ("- docker/...") is new when the open issue does not hold the same line. Editing sends no
              # notification, so the new lines go in one comment, before the edit: if the comment fails, the body is not
              # updated and the next run still sees them as new.
              gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r' > "$RUNNER_TEMP/old-body.md"
              new=$(grep -E '^- ' "$RUNNER_TEMP/advisories.md" | grep -vxFf "$RUNNER_TEMP/old-body.md" || true)
              if [[ -n "$new" ]]; then
                printf 'New since the last run:\n\n%s\n\nRun: %s/%s/actions/runs/%s\n' "$new" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/new-findings.md"
                gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/new-findings.md"
              fi
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
            else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"; fi
          elif [[ -n "$number" ]]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "The audit is clean again: no HIGH or CRITICAL advisory without a valid exception."
          fi
