name: Release validation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

      - name: Validate
        run: |
          docker compose --env-file .env.example -f docker/docker-compose.yml -f docker/docker-compose.override.yml config --quiet

      - name: Release readiness gate
        run: bash scripts/check-release.sh
      # Publishing is an explicit maintainer step after this tag's checks pass:
      # gh release create v0.2.0-demo --verify-tag --prerelease --latest=false ...
