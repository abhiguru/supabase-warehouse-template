groups:
  - name: heartbeat
    rules:
      # Always firing (vector(1)), routed to Slack once a day (docker/alertmanager.slack.yml,
      # repeat_interval 24h). The facility sees "Monitoring is alive" daily; a day without that message
      # means Prometheus, Alertmanager or the Slack webhook is broken (docs/MONITORING.md, "Watchdog").
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: heartbeat
        annotations:
          summary: "Monitoring is alive"
          description: "This message arrives once a day while Prometheus, Alertmanager and the Slack webhook all work. If a day passes without it, alerting is broken."

  - name: supabase_alerts
    rules:
      - alert: HighCPU
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage above 80% for more than 5 minutes"

      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage above 85% for more than 5 minutes"

      - alert: DatabaseConnectionsHigh
        # postgres-exporter reports one series per database, state, user, application, backend
        # type and wait event: add up the client connections of each server. Background workers
        # (autovacuum, WAL writer, ...) are left out. Tests: docker/alert-rules.test.yml.
        expr: sum by (instance, job) (pg_stat_activity_count{backend_type="client backend"}) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High database connections"
          description: "{{ $value }} client connections on {{ $labels.instance }}, above 80% of the configured 100-connection ceiling"

      - alert: SlowQueries
        expr: pg_stat_activity_max_tx_duration > 60
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Slow query detected"
          description: "Query running longer than 60 seconds"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Disk space below 20% on root filesystem"

      - alert: DiskSpaceLowOtherFilesystem
        # A second disk (database or backup volume) mounted beside the root filesystem.
        expr: (node_filesystem_avail_bytes{mountpoint!="/",fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{mountpoint!="/",fstype=~"ext4|xfs|btrfs"}) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.mountpoint }}"
          description: "Less than 10% free on {{ $labels.mountpoint }}"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database is not responding"

  - name: database_performance_alerts
    rules:
      - alert: LongRunningTransaction
        expr: pg_stat_activity_max_tx_duration > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Long running transaction"
          description: "Transaction running for {{ $value }} seconds"

      - alert: LowCacheHitRatio
        expr: (pg_stat_database_blks_hit{datname="postgres"} / (pg_stat_database_blks_hit{datname="postgres"} + pg_stat_database_blks_read{datname="postgres"} + 0.001)) < 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit ratio"
          description: "PostgreSQL cache hit ratio below 90%"

      - alert: HighDeadTuples
        expr: sum(pg_stat_user_tables_n_dead_tup) > 100000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High dead tuple count"
          description: "High dead tuple count: {{ $value }}. Consider running VACUUM."

  - name: container_alerts
    rules:
      - alert: ContainerOOM
        expr: increase(container_oom_events_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Container OOM event"
          description: "Container OOM event detected"

      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes{name=~"warehouse-.*",container_label_com_docker_compose_service!=""} / container_spec_memory_limit_bytes{name=~"warehouse-.*",container_label_com_docker_compose_service!=""}) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container high memory"
          description: "Container {{ $labels.name }} using >90% memory"

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name=~"warehouse-.*",container_label_com_docker_compose_service!=""}[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container restarting frequently"
          description: "Container {{ $labels.name }} has restarted more than 3 times in the last hour"

  - name: api_alerts
    rules:
      - alert: APIHighLatency
        # Kong 3 metric names (prometheus plugin, enabled in kong.yml). Kong 2
        # called these kong_latency_bucket{type="request"} and kong_http_status.
        expr: histogram_quantile(0.95, sum(rate(kong_request_latency_ms_bucket[5m])) by (le, service)) > 2000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "95th percentile API latency above 2 seconds for service {{ $labels.service }}"

      - alert: APIHighErrorRate
        expr: sum(rate(kong_http_requests_total{code=~"5.."}[5m])) / sum(rate(kong_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API error rate"
          description: "API 5xx error rate above 5%"

      - alert: APIDown
        expr: up{job="kong"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API Gateway is down"
          description: "Kong API Gateway is not responding"

      - alert: ScrapeTargetDown
        # Every other scrape job in prometheus.yml; the gateway has APIDown above.
        expr: up{job!="kong"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Monitoring target {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }})"

  - name: backup_alerts
    # warehouse_backup_* comes from the backup scripts (scripts/backup-metrics.sh) through node
    # exporter's textfile collector: kind="disk" is scripts/backup.sh (npm run db:backup, also run by
    # the USB backup), kind="usb" is scripts/backup-usb.sh. docs/MONITORING.md, "Backup alerts".
    rules:
      - alert: BackupMissing
        # 26 hours is a daily backup plus two hours of slack. absent() covers an installation that
        # has never made a backup, a missing or unreadable metrics directory and a node exporter
        # without the textfile collector, none of which has a timestamp to compare.
        expr: (time() - warehouse_backup_last_success_timestamp_seconds{kind="disk"} > 26 * 3600) or absent(warehouse_backup_last_success_timestamp_seconds{kind="disk"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No backup in the last 26 hours"
          description: "No successful backup (npm run db:backup) in the last 26 hours, or no backup metric is exported. Check the backup schedule and docs/MONITORING.md, Backup alerts."

      - alert: BackupFailed
        # The last attempt of this kind failed; the value stays 0 until an attempt succeeds.
        expr: warehouse_backup_last_attempt_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The last {{ $labels.kind }} backup failed"
          description: "The last {{ $labels.kind }} backup attempt failed. Run npm run doctor, and bash scripts/backup-usb.sh status for a USB backup."
