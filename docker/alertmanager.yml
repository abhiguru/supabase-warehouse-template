global:
  resolve_timeout: 5m

# Used only with `setup.sh --operator --alert-webhook-file off` (a non-production install): alerts stay
# queryable in this Alertmanager and nothing leaves the host. A facility with a Slack webhook gets
# docker/alertmanager.slack.yml instead.
route:
  receiver: local-only
  group_wait: 1s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: local-only

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname']
