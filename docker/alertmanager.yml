global:
  resolve_timeout: 5m

route:
  receiver: 'slack-default'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - match:
        severity: critical
      receiver: 'slack-critical'
      continue: true

    - match:
        alertname: DatabaseConnectionsHigh
      receiver: 'slack-database'
    - match:
        alertname: SlowQueries
      receiver: 'slack-database'
    - match:
        alertname: PostgresDown
      receiver: 'slack-database'
    - match:
        alertname: LongRunningTransaction
      receiver: 'slack-database'
    - match:
        alertname: LowCacheHitRatio
      receiver: 'slack-database'
    - match:
        alertname: HighDeadTuples
      receiver: 'slack-database'

receivers:
  - name: 'slack-default'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
        channel: '#alerts-infrastructure'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:warning:{{ else }}:white_check_mark:{{ end }} {{ .Status | toUpper }} ({{ .Alerts | len }} alerts)'
        text: |-
          {{ range .Alerts -}}
          *Alert:* {{ index .Labels "alertname" }}
          *Severity:* {{ if index .Labels "severity" }}{{ index .Labels "severity" }}{{ else }}unknown{{ end }}
          *Status:* {{ .Status }}
          {{ if index .Annotations "description" }}{{ index .Annotations "description" }}{{ else if index .Annotations "summary" }}{{ index .Annotations "summary" }}{{ else }}No description{{ end }}
          ---
          {{ end }}

  - name: 'slack-critical'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
        channel: '#alerts-critical'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} CRITICAL ({{ .Alerts | len }} alerts)'
        text: |-
          {{ range .Alerts -}}
          *Alert:* {{ index .Labels "alertname" }}
          *Description:* {{ if index .Annotations "description" }}{{ index .Annotations "description" }}{{ else }}N/A{{ end }}
          *Status:* {{ .Status }}
          ---
          {{ end }}

  - name: 'slack-database'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
        channel: '#alerts-database'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:floppy_disk:{{ else }}:white_check_mark:{{ end }} DATABASE ({{ .Alerts | len }} alerts)'
        text: |-
          {{ range .Alerts -}}
          *Alert:* {{ index .Labels "alertname" }}
          *Severity:* {{ if index .Labels "severity" }}{{ index .Labels "severity" }}{{ else }}unknown{{ end }}
          *Status:* {{ .Status }}
          {{ if index .Annotations "description" }}{{ index .Annotations "description" }}{{ else }}No description{{ end }}
          ---
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
