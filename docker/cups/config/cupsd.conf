LogLevel warn
MaxLogSize 0
SystemGroup lpadmin
Port 631
Listen *:631
ServerAlias cups
BrowseLocalProtocols dnssd
DefaultAuthType Basic
WebInterface Yes

# The port is not published to the host: only the other containers of this Compose project (Docker's private ranges) and the
# container itself reach it. The web interface and the administration need the container itself (127.0.0.1) and a @SYSTEM login.
<Location />
  Order deny,allow
  Deny from all
  Allow from 127.0.0.1
  Allow from 172.16.0.0/12
  Allow from 10.0.0.0/8
  Allow from 192.168.0.0/16
</Location>

<Location /admin>
  Order deny,allow
  Deny from all
  Allow from 127.0.0.1
  Require user @SYSTEM
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order deny,allow
  Deny from all
  Allow from 127.0.0.1
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  # Submitting a job: from the compose networks only.
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
    Deny from all
    Allow from 127.0.0.1
    Allow from 172.16.0.0/12
    Allow from 10.0.0.0/8
    Allow from 192.168.0.0/16
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
    Deny from all
    Allow from 127.0.0.1
    Allow from 172.16.0.0/12
    Allow from 10.0.0.0/8
    Allow from 192.168.0.0/16
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
    Deny from all
    Allow from 127.0.0.1
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
    Deny from all
    Allow from 127.0.0.1
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
    Deny from all
    Allow from 127.0.0.1
    Allow from 172.16.0.0/12
    Allow from 10.0.0.0/8
    Allow from 192.168.0.0/16
  </Limit>

  # Everything else (Get-Job-Attributes, Get-Printer-Attributes ...): the same networks, no blanket allow.
  <Limit All>
    Order deny,allow
    Deny from all
    Allow from 127.0.0.1
    Allow from 172.16.0.0/12
    Allow from 10.0.0.0/8
    Allow from 192.168.0.0/16
  </Limit>
</Policy>

MaxJobs 500
MaxActiveJobs 0
Timeout 300
Browsing On
DefaultShared Yes
