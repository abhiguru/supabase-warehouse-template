# Production tuning (log limits, resource limits, database settings)
# This file is automatically loaded by Docker Compose alongside docker-compose.yml

# Every service keeps at most three 10 MB log files; without this a service
# uses the Docker daemon's default, which is unbounded unless the host sets one.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    # PostgreSQL performance tuning
    # pg_cron stays preloaded only because locked migration 91 creates the extension on a fresh install;
    # migration 106 drops it again. The squashed baseline removes both.
    command: >-
      postgres
      -c max_connections=100
      -c listen_addresses=*
      -c shared_preload_libraries=pg_stat_statements,pg_cron
      -c pg_stat_statements.track=all
      -c cron.database_name=postgres
      -c cron.log_statement=off
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_messages=warning
      -c log_connections=on
      -c log_disconnections=on
      -c log_statement=none
      -c log_min_duration_statement=-1
      -c log_lock_waits=on
      -c log_temp_files=0
      -c wal_level=replica
      -c archive_mode=off
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=32MB
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=15min
      -c min_wal_size=256MB
      -c max_wal_size=2GB
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  cups:
    logging: *default-logging

  sensor-bridge:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  pdf-renderer:
    logging: *default-logging
    # docker-compose.yml sets mem_limit, memswap_limit and pids_limit; Compose rejects a
    # deploy limit that differs from them, so memory and pids repeat the same values here.
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
          pids: 512

  functions:
    logging: *default-logging
    # Same HTTP probe as docker-compose.yml: GET /hello on the main service port
    # must answer 200, not merely accept a TCP connection.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000
          && printf "GET /hello HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
          && head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  kong:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  rest:
    logging: *default-logging
    environment:
      PGRST_DB_POOL: "20"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
      PGRST_DB_CONFIG: "false"
      PGRST_DB_PREPARED_STATEMENTS: "true"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  supavisor:
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  storage:
    logging: *default-logging
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
