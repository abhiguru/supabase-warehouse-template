# Supabase Warehouse Template - Docker Compose
#
# Run it only through scripts/compose.sh (it checks the operator state, which owns the data paths and the
# environment file); setup.sh, start.sh and stop.sh do. For example:
#   bash scripts/compose.sh ps
#   bash scripts/compose.sh logs --tail 50 gateway
#   bash scripts/compose.sh --profile '*' config

name: warehouse-template

# Every service keeps at most three 10 MB log files; without this a service
# uses the Docker daemon's default, which is unbounded unless the host sets one.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # gateway - plain nginx from the official image (docker/nginx, replaced Kong 2026-10): the routes, the key check, the
  # rate limits, CORS and the body limits of docs/CONTAINER_SECURITY.md, "Gateway limits and routes". The configuration is
  # in docker/nginx; the image's entrypoint puts the three values below into its templates. It publishes the one host
  # port, on loopback, for the Cloudflare Tunnel connector.
  gateway:
    build:
      context: ./nginx
    restart: unless-stopped
    logging: *default-logging
    # nginx runs as the user `nginx` (101) of the image: no capability is needed for port 8000, the root file system is
    # read-only, and the only writable places are two small tmpfs: /tmp (the pid file and nginx's temporary paths, which
    # stay empty: request bodies and answers are never written to a file, docker/nginx/nginx.conf) and the directory
    # the entrypoint renders the templates into.
    read_only: true
    tmpfs:
      - /tmp:size=4m
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755,size=1m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    # /health is answered by nginx itself (docker/nginx/templates/gateway.conf.template). The image has busybox wget, not curl.
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # GATEWAY_HTTP_PORT, or the name it had while the gateway was Kong (KONG_HTTP_PORT) in a compose.env that has not been
      # rewritten yet; scripts/configure.mjs writes the new name when it changes the port.
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-${KONG_HTTP_PORT:-18000}}:8000/tcp"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Put into docker/nginx/templates by the image's entrypoint (envsubst), and only these three
      # (NGINX_ENVSUBST_FILTER in docker/nginx/Dockerfile). The entrypoint refuses to start on a missing value or on a
      # character that could change the configuration (docker/nginx/docker-entrypoint.d/18-require-env.sh).
      ANON_KEY: ${ANON_KEY:?Set the anon key}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Set the service-role key}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?Set trusted browser origin}

  # gateway-lan - the LAN fallback (docs/OPERATOR_INSTALL.md, "LAN fallback"): the gateway's own image (the one built for the `gateway`
  # service above, not a second build: an upgrade that rebuilds the gateway rebuilds this too, and the two can never be different
  # versions) with a second server (docker/nginx/lan/gateway-lan.conf.template, kept in that image under /etc/nginx/templates-lan)
  # that listens on plain http on the warehouse network. Phones use it only when the internet path to the public address fails. It is
  # a Compose profile, off by default: `bash scripts/lan.sh on` writes LAN_ENABLED, LAN_BIND_IP, LAN_HTTP_PORT, LAN_CIDR and
  # COMPOSE_PROFILES=lan to config/compose.env, and start.sh, setup.sh and the boot unit start it with the rest (start.sh and
  # setup.sh start it apart from the others and never wait for it: a fault of the fallback is a warning there, never a stop).
  # A separate container, so that a failed bind (the router gave the host another address) or a mistake in the LAN server cannot
  # take the public gateway down. It publishes the host's own private address only. The default is loopback, where nothing outside
  # the host can reach it. Docker accepts the traffic of a published port in its own firewall rules before ufw sees it, so no ufw rule
  # is needed or has any effect: the bind address, the allow list and the Host pin of the LAN server are the controls
  # (docs/CONTAINER_SECURITY.md, "LAN fallback").
  gateway-lan:
    # The tag Compose gives the image it builds for `gateway`: <project>-gateway (scripts/compose.sh passes the project name from
    # WAREHOUSE_PROJECT_NAME). `pull_policy: never`: this tag is local, and a missing one is an error to read, not something to look for
    # on a registry. There is no `build:` here, so nothing builds or records this service on its own (scripts/image-recipes.mjs,
    # scripts/scan-images.sh).
    image: ${WAREHOUSE_PROJECT_NAME:?Run setup.sh to write the project name}-gateway
    pull_policy: never
    restart: unless-stopped
    profiles: ["lan"]
    logging: *default-logging
    # As the gateway: read-only root, no capability, tmpfs for the pid file and the rendered configuration.
    read_only: true
    tmpfs:
      - /tmp:size=4m
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755,size=1m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    # /health is answered by nginx itself (docker/nginx/lan/gateway-lan.conf.template), to the container only.
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # LAN_BIND_IP is the host's own private address (scripts/lan.sh refuses any other); loopback while the LAN is off.
      - "${LAN_BIND_IP:-127.0.0.1}:${LAN_HTTP_PORT:-8080}:8080/tcp"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The image's entrypoint renders the templates of this directory (the LAN server and the http-level template) instead of the
      # public ones. docker/nginx/docker-entrypoint.d/18-require-env.sh then requires LAN_CIDR (the allow list), LAN_BIND_IP and
      # LAN_HTTP_PORT (the Host the server answers to): empty here while the LAN is off, and the container refuses to start then.
      # GATEWAY_ROLE says the same thing a second way. The other three are the gateway's.
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-lan
      GATEWAY_ROLE: lan
      LAN_CIDR: ${LAN_CIDR:-}
      LAN_BIND_IP: ${LAN_BIND_IP:-}
      LAN_HTTP_PORT: ${LAN_HTTP_PORT:-}
      ANON_KEY: ${ANON_KEY:?Set the anon key}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Set the service-role key}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?Set trusted browser origin}

  rest:
    # Index digest (amd64 and arm64): docs/CONTAINER_SECURITY.md, "Image pins".
    image: postgrest/postgrest:v16.5@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
    restart: unless-stopped
    networks: [default, database]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_POOL: "20"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
      # "true" so that PostgREST applies the settings of the role it switches to (anon 3 s, authenticated 8 s statement_timeout,
      # volumes/db/00-bootstrap.sql). With "false" it never reads them: ALTER ROLE ... SET is applied only to the login role,
      # so anon ran under the authenticator's 8 s and changing the two API roles' settings did nothing. No pgrst.* setting
      # exists in the database, so the environment variables below stay the only configuration.
      PGRST_DB_CONFIG: "true"
      PGRST_DB_PREPARED_STATEMENTS: "true"
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD_AUTHENTICATOR:?Run setup.sh to generate the per-role database passwords}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # No OpenAPI document at /rest/v1/: it would list every table and function each role can see.
      # health-check.sh probes a table read instead.
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_PRE_REQUEST: public.check_session
    command: ["postgrest"]

  storage:
    build:
      context: ./storage
    restart: unless-stopped
    networks: [default, database]
    logging: *default-logging
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    volumes:
      - ${WAREHOUSE_STORAGE_PATH:?Set private storage path}:/var/lib/storage:z
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # Storage's migrator reads these two itself (dist/config.js). Its default superuser is "postgres";
      # name the role that really exists so a cluster without "postgres" works.
      DB_SUPER_USER: supabase_storage_admin
      # The roles already exist (database bootstrap). Storage reads this as === "true", so unset is also off;
      # it is set explicitly for clarity.
      DB_INSTALL_ROLES: "false"
      DATABASE_URL: postgres://supabase_storage_admin:${DB_PASSWORD_STORAGE:?Run setup.sh to generate the per-role database passwords}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"

  functions:
    build:
      context: ./edge-runtime
    restart: unless-stopped
    # `default` for the gateway and `renderer` (internal) for the PDF renderer.
    networks: [default, renderer]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # The edge runtime has no health endpoint and ships neither wget nor curl.
    # Probe the public `hello` function (functions/main/index.ts) on the main
    # service port 9000 over bash /dev/tcp and require an HTTP 200 status line,
    # so a listening socket whose worker cannot start is reported unhealthy.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000
          && printf "GET /hello HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
          && head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ../functions:/home/deno/functions:ro,Z
      - ${WAREHOUSE_MANIFEST_PATH:?Set public manifest path}:/etc/warehouse/instance.json:ro
      # The state's public directory, for the optional central sign-in key file
      # (CENTRAL_JWKS_FILE) and the optional letterhead image (LETTERHEAD_FILE). A directory, not the file: the file may be absent,
      # and a replaced file is seen without recreating the container.
      # scripts/compose.sh sets the path for every state, old or new.
      - ${WAREHOUSE_PUBLIC_PATH:?Run through scripts/compose.sh}:/etc/warehouse/public:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://gateway:8000
      # PostgREST and Storage are called directly, not through the gateway (functions/_shared/supabase-rest.ts): no key
      # check, rate limit or body limit of the gateway on this path. Both are on `default`, as functions is. Storage
      # never receives CF-Connecting-IP from here: the client sends only apikey and Authorization.
      SUPABASE_REST_URL: http://rest:3000
      SUPABASE_STORAGE_URL: http://storage:5000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      PDF_RENDERER_URL: http://pdf-renderer:3000
      # The LAN fallback address (scripts/lan.sh): get-config offers it to signed-in phones as urls.lan. get-public-config never
      # does. ":-" so a state from before these lines still renders.
      LAN_ENABLED: ${LAN_ENABLED:-}
      LAN_BIND_IP: ${LAN_BIND_IP:-}
      LAN_HTTP_PORT: ${LAN_HTTP_PORT:-}
      VERIFY_JWT: "true"
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      APP_ENV: ${APP_ENV:?Operator environment required}
      AUTH_MODE: ${AUTH_MODE:?Operator mode required}
      # Central sign-in; both empty = off. ":-" so a state from before these lines still renders.
      CENTRAL_ISSUER: ${CENTRAL_ISSUER:-}
      CENTRAL_JWKS_URL: ${CENTRAL_JWKS_URL:-}
      CENTRAL_JWKS_FILE: ${CENTRAL_JWKS_FILE:-}
      # on = this facility also asks for its own SMS code at every central sign-in (default off).
      CENTRAL_LOCAL_CODE: ${CENTRAL_LOCAL_CODE:-}
      CENTRAL_JWKS_DIR: /etc/warehouse/public
      # The optional letterhead image of the document PDFs (setup.sh --letterhead-file): letterhead.jpg or
      # letterhead.png in the public directory above; empty = plain PDFs. ":-" so a state from before it still renders.
      LETTERHEAD_FILE: ${LETTERHEAD_FILE:-}
      LETTERHEAD_DIR: /etc/warehouse/public
      INSTANCE_MANIFEST_PATH: /etc/warehouse/instance.json
    command:
      [
        "start",
        "--main-service", "/home/deno/functions/main"
      ]

  db:
    build:
      context: ./postgres
    restart: unless-stopped
    networks: [database]
    logging: *default-logging
    stop_grace_period: 30s
    # Docker gives a container 64 MB of /dev/shm; a parallel hash join allocates its shared memory there, and a larger
    # work_mem or several parallel plans at once fail with "could not resize shared memory segment". It counts against the
    # memory limit below only when used.
    shm_size: 256m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    volumes:
      # The official image runs only the top level of /docker-entrypoint-initdb.d, in name order,
      # once, on an empty data directory.
      - ./volumes/db/00-bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro,Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro,Z
      - ${WAREHOUSE_DB_PATH:?Set private database path}:/var/lib/postgresql/data:Z
    tmpfs:
      # The official 18 image declares VOLUME /var/lib/postgresql, which would leave an anonymous volume behind
      # at every stop. A small tmpfs takes that path; the bind mount above sits inside it.
      - /var/lib/postgresql:size=16m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "supabase_admin", "-d", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      # The official PostgreSQL 18 image defaults PGDATA to /var/lib/postgresql/18/docker and declares the VOLUME
      # /var/lib/postgresql. The data directory of this stack stays at the path mounted above, set explicitly, so a
      # new image can never start an empty cluster somewhere else. Keep the mount, PGDATA, scripts/compose.sh,
      # scripts/verify-restore.sh and tests/migrations.sh the same.
      PGDATA: /var/lib/postgresql/data
      # The bootstrap superuser. There is no role named postgres.
      POSTGRES_USER: supabase_admin
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # For volumes/db/roles.sql, the first-start init script (an empty data
      # directory); scripts/configure-db-roles.sql sets them on every setup run.
      DB_PASSWORD_AUTHENTICATOR: ${DB_PASSWORD_AUTHENTICATOR:?Run setup.sh to generate the per-role database passwords}
      DB_PASSWORD_STORAGE: ${DB_PASSWORD_STORAGE:?Run setup.sh to generate the per-role database passwords}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
      AUTH_MODE: ${AUTH_MODE:?Operator mode required}
      APP_ENV: ${APP_ENV:?Operator environment required}
      SMS_PROVIDER: ${SMS_PROVIDER:?MSG91 provider required}
      SMS_PRODUCTION_MODE: ${SMS_PRODUCTION_MODE:?Production SMS mode required}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:?MSG91 auth key required}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:?MSG91 Flow ID required}
      MSG91_PE_ID: ${MSG91_PE_ID:?MSG91 PE ID required}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:?MSG91 sender ID required}
    # Logging (docs/MONITORING.md, "Finding a slow query"): the log shares its 3 x 10 MB with everything else, so it carries what
    # a diagnosis needs and not one line per connection. A statement slower than 1 s is logged with its text but never its
    # parameter values (log_parameter_max_length=0: PostgREST sends the request body as a parameter, and a sign-in code is in
    # it); temporary files of 10 MB or more are logged (log_temp_files is in kB); connections and disconnections are not.
    # PostgreSQL performance tuning. timezone and log_timezone are set to UTC (the facilities ran Etc/UTC, the same offset):
    # the SQL code and its tests assume the time zone is named UTC. extra_float_digits is not set: the facilities ran the
    # server default of 1 and the official image starts the same way.
    command: >-
      postgres
      -c max_connections=100
      -c listen_addresses=*
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c timezone=UTC
      -c log_timezone=UTC
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_messages=warning
      -c log_connections=off
      -c log_disconnections=off
      -c log_statement=none
      -c log_min_duration_statement=1000
      -c log_parameter_max_length=0
      -c log_lock_waits=on
      -c log_temp_files=10240
      -c wal_level=replica
      -c archive_mode=off
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c wal_buffers=32MB
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=15min
      -c min_wal_size=256MB
      -c max_wal_size=2GB

  # Connection pooler (optional, off by default) — turn on with: bash scripts/pooler.sh on (off: bash scripts/pooler.sh off)
  supavisor:
    build:
      context: ./supavisor
    restart: unless-stopped
    profiles: ["pooler"]
    networks: [database]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # The upstream entrypoint requires this limit; Docker defaults vary by host.
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      - ./volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro,z
    healthcheck:
      test: ["CMD", "curl", "-sSfL", "--head", "-o", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Migration, tenant initialization and server startup each boot the VM.
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      PROXY_PORT_SESSION: "5432"
      PROXY_PORT_TRANSACTION: "6543"
      PROXY_PORT: "5412"
      PROM_POLL_RATE: "15000"
      LOCAL_PROXY_MULTIPLIER: "1"
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      # The pool user's own password (volumes/pooler/pooler.exs); the superuser
      # password only for Supavisor's metadata database.
      # Set by `bash scripts/pooler.sh on`; empty while the pooler is off (Compose reads this file whether or not the
      # profile runs). The command below refuses to start without them.
      DB_PASSWORD_POOLER: ${DB_PASSWORD_POOLER:-}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      CLUSTER_POSTGRES: true
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY:-}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
    command:
      [
        "/bin/sh", "-c",
        "[ -n \"$$DB_PASSWORD_POOLER\" ] && [ -n \"$$SECRET_KEY_BASE\" ] && [ -n \"$$VAULT_ENC_KEY\" ] || { echo 'The pooler is off: run bash scripts/pooler.sh on' >&2; exit 1; }; /app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"
      ]

  # CUPS Print Server — start with: docker compose --profile printing up -d
  cups:
    build:
      context: ./cups
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: ["printing"]
    logging: *default-logging
    privileged: true
    volumes:
      - ./cups/config/cupsd.conf:/etc/cups/cupsd.conf.custom:ro,z
      - cups-spool:/var/spool/cups
      - /dev/usb:/dev/usb:rw
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      CUPS_ADMIN_USER: ${CUPS_ADMIN_USER:-admin}
      CUPS_ADMIN_PASSWORD: ${CUPS_ADMIN_PASSWORD:?Run setup to generate a password}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:631/"]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 40s

  # Tapo sensor bridge — start with: bash scripts/compose.sh --profile sensors up -d --wait sensor-bridge
  # Polls the facility's Tapo hubs on the LAN and posts readings to the
  # ingest-sensor-readings function through the gateway (docs/SENSORS.md).
  # GPL-3.0-or-later code in its own directory (docker/sensor-bridge/LICENSE).
  # On `default` only: it calls the gateway and nothing else in the project, and it
  # cannot reach the database. Every variable has a
  # default, so `compose config` keeps working on an installation that never
  # set them; an unconfigured bridge exits 78 when started.
  sensor-bridge:
    build:
      context: ./sensor-bridge
    restart: unless-stopped
    profiles: ["sensors"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # As in docker-compose.standalone.yml: only /data (queue, change detector,
    # health file) and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - sensor-bridge-data:/data
    environment:
      SENSOR_BRIDGE_HUBS: ${SENSOR_BRIDGE_HUBS:-}
      TAPO_USERNAME: ${TAPO_USERNAME:-}
      TAPO_PASSWORD: ${TAPO_PASSWORD:-}
      SENSOR_INGEST_URL: http://gateway:8000/functions/v1/ingest-sensor-readings
      SENSOR_INGEST_KEY: ${SENSOR_INGEST_KEY:-}
      SENSOR_BRIDGE_ID: ${SENSOR_BRIDGE_ID:-}
      SENSOR_BRIDGE_POLL_SECONDS: ${SENSOR_BRIDGE_POLL_SECONDS:-300}
      SENSOR_BRIDGE_POST_SECONDS: ${SENSOR_BRIDGE_POST_SECONDS:-60}
      SENSOR_BRIDGE_HEARTBEAT_SECONDS: ${SENSOR_BRIDGE_HEARTBEAT_SECONDS:-300}
      SENSOR_BRIDGE_REBOOT_CRON: ${SENSOR_BRIDGE_REBOOT_CRON:-}
      SENSOR_BRIDGE_MAX_BATCH: ${SENSOR_BRIDGE_MAX_BATCH:-200}
      SENSOR_BRIDGE_LOG_LEVEL: ${SENSOR_BRIDGE_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-m", "sensor_bridge.health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # pdf-renderer - HTML to PDF conversion (chrome-headless-shell driven by puppeteer-core;
  # docker/pdf-renderer, API in its README). It sits on the internal `renderer` network
  # with `functions` and nothing else: no ports, no route to the internet, the database
  # or gateway. `functions` does not depend_on it, so a renderer restart never
  # restarts or blocks the function runtime.
  pdf-renderer:
    build: ./pdf-renderer
    restart: unless-stopped
    networks: [renderer]
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    # 1.5 GiB is required, not a preference: the renderer's memory thresholds are sized for it (its README).
    # Compose rejects a deploy limit that differs from mem_limit and pids_limit, so the deploy block repeats them.
    mem_limit: 1536m
    memswap_limit: 1536m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
          pids: 512
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 30s

volumes:
  cups-spool:
  sensor-bridge-data:

# Three project-scoped networks; services resolve each other by DNS name only
# on a network they share (tests/compose-networks.test.mjs holds the table).
#   default   the gateway and its upstreams
#   database  the database and the services that open a connection to it
#   renderer  internal (no outside route): the function runtime and the PDF renderer only
# A service that is not listed under `database` cannot open a connection to
# PostgreSQL at all.
networks:
  database:
  renderer:
    internal: true
