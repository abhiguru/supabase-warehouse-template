_format_version: '3.0'
_transform: true

###
### Consumers / Users
###
consumers:
  - username: anon
    keyauth_credentials:
      - key: ${SUPABASE_ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SUPABASE_SERVICE_KEY}

###
### API Routes
###
services:
  ## Secure REST routes
  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins: [${CORS_ALLOWED_ORIGIN}]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, Content-Type, X-Client-Info, apikey, Prefer, Range]
          exposed_headers: [Content-Range, X-Request-Id]
          credentials: true
          max_age: 86400
      - name: request-size-limiting
        config:
          allowed_payload_size: 10
      - name: key-auth
        config:
          hide_credentials: true
      - name: rate-limiting
        config:
          # Owner decision of 2026-10-11. All phones of a facility share one
          # address, so this is the budget of a whole facility: 1800 per
          # fixed minute, which is 18 requests a minute for each of 100
          # phones working at once and about 30 a second on average, with no
          # per-second brake (one address may use the whole minute's budget
          # in a burst). There is no hourly window on purpose: a busy hour
          # would use it up and every phone would be refused until it ended.
          # Timed re-reads (2026-10-19) were counted against it: an open order
          # screen asks once every 15 s (4 a minute), a sensor screen once
          # every 60 s (1 a minute). 100 phones all on an order screen use 400
          # of the 1800 (22%), leaving 14 a minute for each phone's own work;
          # 300 phones would use 1200 and leave 600, so a facility of that
          # size raises this number. See docs/CONTAINER_SECURITY.md, REST
          # request limit.
          minute: 1800
          policy: local
          fault_tolerant: true
          # Client address from CF-Connecting-IP (KONG_REAL_IP_HEADER), so one
          # abusive client cannot exhaust the budget shared by every phone.
          limit_by: ip

  ## Storage routes (storage manages its own auth)
  - name: storage-v1
    _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins: [${CORS_ALLOWED_ORIGIN}]
          methods: [GET, POST, PUT, DELETE, OPTIONS]
          headers: [Authorization, Content-Type, X-Client-Info, apikey, Cache-Control, X-Upsert]
          exposed_headers: [Content-Range, X-Request-Id]
          credentials: true
          max_age: 86400
      - name: request-size-limiting
        config:
          allowed_payload_size: 50
      # Storage does not use the client address (its image-render rate limit is
      # off) but writes CF-Connecting-IP into its own request log, so the header
      # is not passed on. Kong itself adds X-Real-IP and X-Forwarded-For after
      # the plugins have run; this plugin cannot remove them (checked on Kong
      # 3.9.3, docs/CONTAINER_SECURITY.md Logs), so they are not listed here.
      - name: request-transformer
        config:
          remove:
            headers:
              - CF-Connecting-IP

  ## Edge Functions routes
  - name: functions-v1
    _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
        config:
          origins:
            - ${CORS_ALLOWED_ORIGIN}
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - X-Client-Info
            - apikey
          exposed_headers:
            - X-Request-Id
          credentials: true
          max_age: 86400
      - name: request-size-limiting
        config:
          allowed_payload_size: 10
      - name: rate-limiting
        config:
          # Owner decision of 2026-10-11: 100 a minute stays, the hourly cap goes
          # from 2000 to 6000. 6000 is what 100 a minute adds up to in an hour,
          # so the hourly window no longer refuses a facility that stays within
          # the minute limit. See docs/CONTAINER_SECURITY.md, REST request limit.
          minute: 100
          hour: 6000
          policy: local
          fault_tolerant: true
          limit_by: ip
