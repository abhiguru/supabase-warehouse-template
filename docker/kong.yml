  ## Secure REST routes
  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins: [${CORS_ALLOWED_ORIGIN}]
          methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          headers: [Authorization, Content-Type, X-Client-Info, apikey, Prefer, Range]
          exposed_headers: [Content-Range, X-Request-Id]
          credentials: true
          max_age: 86400
      - name: request-size-limiting
        config:
          allowed_payload_size: 10
      - name: key-auth
        config:
          hide_credentials: true
      - name: rate-limiting
        config:
          minute: 300
          hour: 6000
          policy: local
          fault_tolerant: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure GraphQL routes
  - name: graphql-v1
    _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
    url: http://rest:3000/rpc/graphql
    routes:
      - name: graphql-v1-all
        strip_path: true
        paths:
          - /graphql/v1
    plugins:
      - name: cors
        config:
          origins: [${CORS_ALLOWED_ORIGIN}]
          methods: [GET, POST, OPTIONS]
          headers: [Authorization, Content-Type, X-Client-Info, apikey]
          credentials: true
          max_age: 86400
      - name: request-size-limiting
        config:
          allowed_payload_size: 2
      - name: key-auth
        config:
          hide_credentials: true
      - name: request-transformer
        config:
          add:
            headers:
              - Content-Profile:graphql_public
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure Realtime routes
  - name: realtime-v1-ws
    _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
    url: http://realtime-dev:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
        config:
          origins: [${CORS_ALLOWED_ORIGIN}]
          methods: [GET, OPTIONS]
          headers: [Authorization, Content-Type, X-Client-Info, apikey]
          credentials: true
          max_age: 86400
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
  - name: realtime-v1-rest
    _comment: 'Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*'
    url: http://realtime-dev:4000/api
    protocol: http
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors
        config:
          origins: [${CORS_ALLOWED_ORIGIN}]
          methods: [GET, POST, OPTIONS]
          headers: [Authorization, Content-Type, X-Client-Info, apikey]
          credentials: true
          max_age: 86400
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Storage routes (storage manages its own auth)
  - name: storage-v1
    _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins: [${CORS_ALLOWED_ORIGIN}]
          methods: [GET, POST, PUT, DELETE, OPTIONS]
          headers: [Authorization, Content-Type, X-Client-Info, apikey, Cache-Control, X-Upsert]
          exposed_headers: [Content-Range, X-Request-Id]
          credentials: true
          max_age: 86400
      - name: request-size-limiting
        config:
          allowed_payload_size: 50

  ## Edge Functions routes
  - name: functions-v1
    _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
        config:
          origins:
            - ${CORS_ALLOWED_ORIGIN}
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - X-Client-Info
            - apikey
          exposed_headers:
            - X-Request-Id
          credentials: true
          max_age: 86400
      - name: request-size-limiting
        config:
          allowed_payload_size: 10
      - name: rate-limiting
        config:
          minute: 100
          hour: 2000
          policy: local
          fault_tolerant: true
