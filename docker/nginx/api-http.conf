# The http-level parts the API routes need (api-locations.conf): rate limits, upstreams, the CORS preflight test. Included
# by nginx.conf. Nothing here holds a secret or an environment variable; those are in templates/http.conf.template.

# --- Rate limits -----------------------------------------------------------------------------------------------------
# Per client address: `$binary_remote_addr` is the address the realip module settled on, that is CF-Connecting-IP from the
# tunnel hop (templates/gateway.conf.template), so one abusive client cannot use up the budget shared by every phone.
# Requests answered 401 (no or wrong key) or 413 (body too large) are refused before the limit is reached and do not count.
#
# nginx limits with a leaky bucket, not with counters per clock minute (Kong's rate-limiting plugin did): the bucket holds
# `burst` requests, is emptied at `rate`, and the next request is refused (HTTP 429) while it is full. `nodelay` passes
# the requests in the bucket at once instead of spacing them out.
#
# REST. Owner decision of 2026-10-11. All phones of a facility share one address, so this is the budget of a whole
# facility: a burst of 1800 requests at once, then 30 a second, which is 1800 a minute on average and 18 a minute for each
# of 100 phones working at once. A facility that has been quiet for a minute has the whole bucket again, so from a cold start
# up to 3600 requests pass in the first minute, and 1800 a minute after that. There is no hourly window on purpose: a busy
# hour would use it up and every phone would be refused until it ended.
# Timed re-reads (2026-10-19) count against it: an open order screen asks once every 15 s (4 a minute), a sensor screen
# once every 60 s (1 a minute). 100 phones all on an order screen use 400 of the 1800 (22%), leaving 14 a minute for
# each phone's own work; 300 phones would use 1200 and leave 600, so a facility of that size raises these numbers
# (rate and burst, together). See docs/CONTAINER_SECURITY.md, REST request limit.
limit_req_zone $binary_remote_addr zone=rest:10m rate=30r/s;
# Functions. Owner decision of 2026-10-11: 100 a minute stays. The hourly cap of 6000 is gone: 6000 is exactly what
# 100 a minute adds up to in an hour, so a bucket that refills at 100 a minute passes no more than 6000 an hour (and the
# 100 it holds), and a second hourly rule would refuse nothing the first does not. The bucket holds 100 at once, then
# one every 0.6 s.
# This route is also the gateway's brake per address on OTP requests; the database has its own OTP limits per source.
limit_req_zone $binary_remote_addr zone=functions:10m rate=100r/m;
# Storage has no limit: a list screen loads one image per row and every phone at a facility shares one public address, so
# a limit low enough to matter could refuse ordinary use; it needs request counts from a running facility before a
# number is chosen.

# Kong's rate limiting was `fault_tolerant: true`: if its counters could not be read, requests were let through. nginx keeps
# the buckets in shared memory of the gateway itself (10 MB a zone, room for about 160,000 addresses), so there is no counter
# store that can fail and nothing to tolerate. When a zone is full the oldest state is dropped to make room: the client
# it belonged to starts again with an empty bucket (all of its burst available), which is the lenient direction.

limit_req_status 429;
# A refused request is in the access log as 429 (scripts/watch.mjs counts them). The error log line would carry the
# request line, query string included, and a flood would fill it, so it is kept at a level below the log's `warn`.
limit_req_log_level info;

# --- Upstreams -------------------------------------------------------------------------------------------------------
# `resolve` looks the name up through the resolver of nginx.conf every 5 s and swaps the addresses of a replaced
# container in, without a reload; the names are not looked up once at start. `zone` is what `resolve` needs. `keepalive`
# keeps idle connections to the upstream for reuse (proxy_http_version 1.1 and an empty Connection header in the routes).
# The idle time (15 s) is shorter than Kong's was (60 s), so a request is less likely to meet a connection that the upstream
# has just closed.
upstream rest_up {
    zone rest_up 64k;
    server rest:3000 resolve;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 15s;
}
upstream storage_up {
    zone storage_up 64k;
    server storage:5000 resolve;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 15s;
}
upstream functions_up {
    zone functions_up 64k;
    server functions:9000 resolve;
    keepalive 64;
    keepalive_requests 10000;
    keepalive_timeout 15s;
}

# --- CORS preflight --------------------------------------------------------------------------------------------------
# A preflight is an OPTIONS request with an Origin and an Access-Control-Request-Method header (what Kong's cors plugin
# treated as one); any other OPTIONS request goes to the upstream like every other method. The routes answer a preflight
# themselves, before the key check and the rate limit, as Kong did.
map "$request_method|$http_origin|$http_access_control_request_method" $cors_preflight {
    default 0;
    "~^OPTIONS\|[^|]+\|[^|]+$" 1;
}

# --- The path the upstream gets --------------------------------------------------------------------------------------
# The route's prefix removed (Kong's strip_path), from the request as the client sent it: path and query string,
# not re-encoded, so an encoded character (%2C, %20, %2F in an object name) reaches the upstream exactly as sent. The
# prefix must also stand at the start of the raw request: a request whose cleaned-up path matches a route but whose raw
# path does not (for example one with `/../` in it) gets no path and is refused (404) by the route.
# Several slashes in front are accepted, as Kong's router merged them.
#
# A dot segment in the raw path (`/./` or `/../`, also written %2e or with the slash as %2F, and at the end of the path
# or in front of the query string) is refused the same way, by the first line of each map. nginx chooses the route from
# the cleaned-up path, but the upstream gets the raw one, and a `..` that the upstream resolves could reach another object
# of Storage than the one the route and the key check were about. Nothing the app sends has such a segment (it never
# creates object names with one), and the query string is not looked at (`[^?]*`). A name such as `a..b` or `..hidden`
# is not a dot segment and passes. This is a rule Kong did not have (an owner decision of 2026-10, defence in depth).
map $request_uri $rest_path {
    default "";
    "~^[^?]*(?:/|%2[fF])(?:\.|%2[eE]){1,2}(?:/|%2[fF]|\?|$)" "";
    "~^/+rest/v1(?<rest_tail>/.*)$" $rest_tail;
}
map $request_uri $storage_path {
    default "";
    "~^[^?]*(?:/|%2[fF])(?:\.|%2[eE]){1,2}(?:/|%2[fF]|\?|$)" "";
    "~^/+storage/v1(?<storage_tail>/.*)$" $storage_tail;
}
map $request_uri $functions_path {
    default "";
    "~^[^?]*(?:/|%2[fF])(?:\.|%2[eE]){1,2}(?:/|%2[fF]|\?|$)" "";
    "~^/+functions/v1(?<functions_tail>/.*)$" $functions_tail;
}
