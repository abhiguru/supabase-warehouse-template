# The API routes: /rest/v1/ -> PostgREST, /storage/v1/ -> Storage, /functions/v1/ -> the function runtime. Included inside
# a `server` block, by the public server (templates/gateway.conf.template) and, in LAN mode, by the second server on the
# warehouse network, so a rule changed here changes on both. The real-IP trust is NOT here: only the public server trusts a
# client address that arrived in a header (the tunnel hop sets it); a server reached directly must use the address of the
# connection, and every route below sets CF-Connecting-IP from it.
#
# The route's prefix is removed before the request goes on (Kong's strip_path): /rest/v1/rpc/f?x=1 becomes /rpc/f?x=1 at
# rest:3000. The path comes from $request_uri through the maps in api-http.conf, so it is sent as the client wrote it.
#
# Per route, in this order, as in Kong (cors, key-auth, request-size-limiting, rate-limiting): the CORS preflight is
# answered first; then maintenance mode (every other request is refused with a 503 while WAREHOUSE_MAINTENANCE is `upgrading`,
# whatever its key or path); then the key check; then the body size; then the rate limit. A request refused by an earlier step does
# not use up the rate limit of a later one. One exception, nginx's own: a request whose Content-Length is over the route's
# limit is answered 413 when nginx picks the route, before the preflight, the 404 and the key check (Kong looked at the key
# first); a chunked body over the limit is refused while it is read, after them.

# --- Error answers: the JSON bodies Kong sent --------------------------------------------------------------------------
# The headers an answer exposes to a browser (cors-headers.conf). Each route sets its own; this is the value for an answer
# that no route made, such as the 404 for an unknown path.
set $cors_expose "X-Request-Id";
# The mobile app reads the 401 message (src/config/supabaseConfig.ts, GATEWAY_KEY_REJECTIONS), so the words must not change.
error_page 401 @json_401;
error_page 404 @json_404;
error_page 413 @json_413;
error_page 429 @json_429;
error_page 502 @json_502;
error_page 503 @json_503;
error_page 504 @json_504;

location @json_401 {
    # `types { }` and default_type: a body returned here has the type JSON whatever the extension of the URL is.
    types { }
    default_type "application/json; charset=utf-8";
    add_header WWW-Authenticate Key always;
    include /etc/nginx/cors-headers.conf;
    return 401 '{"message":"$apikey_error"}';
}
location @json_404 {
    types { }
    default_type "application/json; charset=utf-8";
    include /etc/nginx/cors-headers.conf;
    return 404 '{"message":"no Route matched with those values"}';
}
location @json_413 {
    types { }
    default_type "application/json; charset=utf-8";
    include /etc/nginx/cors-headers.conf;
    return 413 '{"message":"Request size limit exceeded"}';
}
location @json_429 {
    types { }
    default_type "application/json; charset=utf-8";
    # The bucket gives a slot back within a second (30 a second for REST, one every 0.6 s for functions).
    add_header Retry-After 1 always;
    include /etc/nginx/cors-headers.conf;
    return 429 '{"message":"API rate limit exceeded"}';
}
location @json_502 {
    types { }
    default_type "application/json; charset=utf-8";
    include /etc/nginx/cors-headers.conf;
    return 502 '{"message":"An invalid response was received from the upstream server"}';
}
location @json_503 {
    types { }
    default_type "application/json; charset=utf-8";
    # Both are set by maintenance mode (api-http.conf): the body says `upgrading` and the retry time is 120 s. Without it the body is
    # the one Kong sent for an upstream that does not answer and there is no Retry-After.
    add_header Retry-After $unavailable_retry_after always;
    include /etc/nginx/cors-headers.conf;
    return 503 $unavailable_body;
}
location @json_504 {
    types { }
    default_type "application/json; charset=utf-8";
    include /etc/nginx/cors-headers.conf;
    return 504 '{"message":"The upstream server is timing out"}';
}

# No route: the path itself, or the prefix without its slash (nginx would answer that with a redirect to a URL built from
# the request's Host header, which the gateway does not want to send).
location / { return 404; }
location = /rest/v1 { return 404; }
location = /storage/v1 { return 404; }
location = /functions/v1 { return 404; }

# --- PostgREST ---------------------------------------------------------------------------------------------------------
location /rest/v1/ {
    set $cors_expose "Content-Range,X-Request-Id";
    # The preflight: the configured origin, credentials, the methods and headers of this route, one day (86400 s) of cache.
    # Kong answered 200 with an empty body; 204 is the usual answer and every browser takes both.
    if ($cors_preflight) {
        include /etc/nginx/cors-headers.conf;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Client-Info,apikey,Prefer,Range" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }
    # Maintenance mode (api-http.conf): the preflight above is answered; everything else gets the 503 of @json_503.
    if ($maintenance_on) { return 503; }
    if ($rest_path = "") { return 404; }
    # The apikey header must be the anon key or the service-role key (templates/http.conf.template). PostgREST and the
    # database check the user's own token after that. This is the only route with a key check: Storage manages its own
    # authentication, and the functions check tokens themselves.
    if ($apikey_error != "") { return 401; }

    include /etc/nginx/cors-headers.conf;
    # Only the gateway answers CORS. An upstream's own Access-Control-* headers (PostgREST sends some) are dropped, or the
    # browser would get two values for the same header and refuse the answer.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    client_max_body_size 10m;
    # A request body is streamed to PostgREST as it arrives (proxy_request_buffering off, nginx.conf), so a client that sends
    # it slowly would hold the upstream connection open; Kong spooled the body before it connected. The timeout is the
    # wait between two reads, not the whole upload: 20 s instead of the default 60.
    client_body_timeout 20s;
    # See api-http.conf. 1800 at once, then 30 a second; both numbers belong together.
    limit_req zone=rest burst=1800 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host rest:3000;
    # The apikey has been checked here and PostgREST does not use it (Kong's hide_credentials).
    proxy_set_header apikey "";
    # The client address is the one this server settled on, never a header the client sent.
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    # The answer is read from PostgREST into memory first and passed on at the client's speed (the tunnel uploads at about
    # 3 MB/s, shared by every phone), so PostgREST is not kept waiting, and it is never written to a file (a file would be on
    # the tmpfs, that is memory too: proxy_max_temp_file_size 0). Kong's buffers were 160k for the headers and 64 of 160k for the
    # body, up to 10 MB a request, inside 512 MB. This container has 128 MB and one client can send many requests at once (the
    # bucket below passes 1800), so these are 32k for the headers (PostgREST sends a few hundred bytes) and 16 buffers of 32k for
    # the body: at most 0.5 MB of nginx memory a request. An answer larger than that is passed on as the client takes it, nginx
    # reading more from PostgREST only when there is room; PostgREST has built the whole body before it sends the first byte,
    # so no database connection is held meanwhile. The 2.2 MB invoice-form preview is such an answer, and it is sent compressed
    # (nginx.conf, gzip), so it leaves quickly. The buffers are not the whole cost of a slow client: the two sockets of a
    # request hold up to 3 MiB of kernel buffers that count against the container as well and that no nginx setting here
    # changes. Measured with readers that stop reading a 10 MB answer: about 4 MiB a request with these buffers, 7 MiB with
    # Kong's, so 20 such readers fit in 128 MB and 30 do not (tests/gateway-nginx.test.mjs holds 20). Real answers are smaller
    # and compress by 90% or more.
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_max_temp_file_size 0;
    proxy_redirect off;
    proxy_pass http://rest_up$rest_path;
}

# --- Storage (it manages its own authentication) ----------------------------------------------------------------------
location /storage/v1/ {
    set $cors_expose "Content-Range,X-Request-Id";
    if ($cors_preflight) {
        include /etc/nginx/cors-headers.conf;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Client-Info,apikey,Cache-Control,X-Upsert" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }
    # Maintenance mode (api-http.conf): the preflight above is answered; everything else gets the 503 of @json_503.
    if ($maintenance_on) { return 503; }
    if ($storage_path = "") { return 404; }

    include /etc/nginx/cors-headers.conf;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    # Photos and documents. No rate limit on this route (api-http.conf says why).
    client_max_body_size 50m;
    # A download of up to 50 MB is passed on as it arrives instead of being collected first: anything over the buffers
    # would be written to the tmpfs, that is to memory, in a container limited to 128 MB. With buffering off nginx relays
    # through one buffer of this size (the default is one page, 4k, which would be some 12,800 read and write rounds for a
    # 50 MB file on half a CPU).
    proxy_buffering off;
    proxy_buffer_size 64k;
    # Not used with buffering off, but nginx refuses to start when its default busy-buffer size (twice the buffer above) does not
    # fit in the default proxy_buffers (eight small ones).
    proxy_buffers 4 64k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host storage:5000;
    # Storage does not use the client address (its image-render rate limit is off) but writes these three headers into its
    # own request log, so they are not passed on, and nothing the client sent under these names either. (Kong could remove
    # CF-Connecting-IP only: it added X-Real-IP and X-Forwarded-For itself after its plugins had run.)
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 5s;
    proxy_redirect off;
    proxy_pass http://storage_up$storage_path;
}

# --- Edge functions --------------------------------------------------------------------------------------------------
location /functions/v1/ {
    set $cors_expose "X-Request-Id";
    if ($cors_preflight) {
        include /etc/nginx/cors-headers.conf;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Client-Info,apikey" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }
    # Maintenance mode (api-http.conf): the preflight above is answered; everything else gets the 503 of @json_503.
    if ($maintenance_on) { return 503; }
    if ($functions_path = "") { return 404; }

    include /etc/nginx/cors-headers.conf;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    client_max_body_size 10m;
    # The wait between two reads of a request body (see the REST route): operator-otp reads its body without a time limit of its own.
    client_body_timeout 20s;
    limit_req zone=functions burst=100 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host functions:9000;
    # The sign-in functions (operator-otp, central-exchange) keep their per-source limits by this header. It is always the
    # address this server settled on, so a client cannot choose it: the public server takes it from the tunnel hop's own
    # header (and only from the hop), a server reached directly uses the connection's address.
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    # Response buffers: 0.5 MB a request at most, for the reason given on the REST route.
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_max_temp_file_size 0;
    proxy_redirect off;
    proxy_pass http://functions_up$functions_path;
}
