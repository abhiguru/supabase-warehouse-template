# The CORS headers every answer of an API route carries (Kong's cors plugin sent them on every answer too, including its
# own 401, 413 and 429). Included in each route, in the answer to a preflight and in the error answers
# (api-locations.conf) because an `add_header` at one level replaces those of the level above instead of adding to them.
# The allowed origin is the one configured origin, always, whatever the request's Origin says (templates/http.conf.template):
# a browser from another origin gets a header that does not name it and refuses the answer. $cors_expose is set by the
# route. `always` puts the headers on error statuses as well.
add_header Access-Control-Allow-Origin $cors_allowed_origin always;
add_header Access-Control-Allow-Credentials true always;
add_header Vary Origin always;
add_header Access-Control-Expose-Headers $cors_expose always;
