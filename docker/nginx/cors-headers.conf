# The CORS headers every answer of an API route carries (Kong's cors plugin sent them on every answer too, including its
# own 401, 413 and 429). Included in each route, in the answer to a preflight and in the error answers
# (api-locations.conf) because an `add_header` at one level replaces those of the level above instead of adding to them.
# The allowed origin is the one configured origin, always, whatever the request's Origin says (templates/http.conf.template):
# a browser from another origin gets a header that does not name it and refuses the answer. $cors_expose is set by the
# route. `always` puts the headers on error statuses as well.
add_header Access-Control-Allow-Origin $cors_allowed_origin always;
add_header Access-Control-Allow-Credentials true always;
add_header Vary Origin always;
add_header Access-Control-Expose-Headers $cors_expose always;
# Which server answered: `public` (the tunnel) or `lan` (the warehouse network, docker/nginx/lan). The app shows it and the LAN
# check of scripts/doctor.mjs reads it. Not a CORS header, but every API answer includes this file, and an add_header in a
# location would otherwise hide one set in the server.
add_header X-Warehouse-Path $warehouse_path always;
# The id of this request (random, 32 hex characters, no user data): the last field of the access log, the X-Request-Id sent to the
# upstream, and this answer header, so one request can be followed from the phone to the gateway and function logs. A route also
# drops an upstream X-Request-Id (proxy_hide_header) so the answer holds exactly one.
add_header X-Request-Id $request_id always;
