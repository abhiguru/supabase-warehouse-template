# Main configuration of the gateway image (docker/nginx/Dockerfile). It replaces the official image's file and adds no
# route: the API (api-http.conf, api-locations.conf) and the public server (templates/) are included below.

# One worker. The container is limited to 0.5 CPU (docker-compose.yml), but "auto" starts one worker per host core and
# each worker keeps its own buffers.
worker_processes 1;
# Two descriptors per proxied request (client and upstream) at most; the container's limit is 65535 (docker-compose.yml).
worker_rlimit_nofile 16384;
pid /tmp/nginx.pid;
# The error log is on stderr. nginx quotes the whole request line, query string included, in an error line (for example
# a timed-out upstream); see docs/CONTAINER_SECURITY.md, Logs.
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Only the name `nginx` in the Server header, never the version. (nginx cannot remove the header in this build.)
    server_tokens off;

    # The container's root file system is read-only (docker-compose.yml): every temporary path is under /tmp, which is a
    # small tmpfs. All five are listed because nginx creates all five at start, whether a module is used or not.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Access log without the query string (docs/CONTAINER_SECURITY.md, "Logs"): the default format writes the whole
    # request line, so a storage signed-URL `?token=` stayed in the log for its 3 x 10 MB of life. `$uri` is the path
    # alone. The client address stays (owner decision of 2026-10-17); Referer, User-Agent and the credential fields of
    # the usual formats are left out. Do not add $request, $request_uri, $args, $query_string, $http_* or $cookie_*:
    # tests/gateway-config.test.mjs fails if one appears. The parser of this line is checkApiLogs in scripts/watch.mjs.
    log_format warehouse_redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
    access_log /dev/stdout warehouse_redacted;

    sendfile on;
    # Idle client connections (cloudflared keeps them open) are closed after 75 s, after at most 10000 requests.
    keepalive_timeout 75s;
    keepalive_requests 10000;

    # Docker's embedded DNS, asked again every 5 s whatever the record's own lifetime. Compose can replace an upstream
    # container (and give it another address) during setup or recovery; a dead address must not be kept for an hour after
    # a healthy replacement exists. Names are only looked up through this resolver (api-http.conf, `resolve`), never
    # once at start, so the gateway also starts when an upstream is not up yet.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # Compress JSON and text answers (an invoice-form preview of 3,055 lines is 2.2 MB of JSON after migration 101; the
    # tunnel uploads at about 3 MB/s). Only the types below are compressed: images, PDFs, other storage downloads and
    # websocket upgrades are not listed, nginx never recompresses an answer that already has Content-Encoding
    # (get-public-config is gzip from the functions container), and it skips range answers.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/json application/vnd.pgrst.object+json application/vnd.pgrst.array+json application/openapi+json application/geo+json text/plain text/csv;

    # Request bodies are streamed to the upstream, never written to disk: /tmp is a tmpfs, so a spooled body would be
    # memory, and the anon key is public, so anyone could send bodies of 10 MB and fill it. Each route still refuses a
    # body over its size limit (api-locations.conf).
    proxy_request_buffering off;

    # The two API keys are map keys (templates/http.conf.template). A key is a JWT of about 200 characters, longer than the
    # default bucket (32 to 128 bytes), and nginx refuses to start when a key does not fit. Set before the first map.
    map_hash_bucket_size 512;

    include /etc/nginx/api-http.conf;
    include /etc/nginx/conf.d/*.conf;
}
