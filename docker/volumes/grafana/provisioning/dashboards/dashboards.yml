# Grafana dashboard provisioning. The dashboards are files in this repository
# (docker/volumes/grafana/dashboards), mounted read-only at /etc/grafana/dashboards by
# docker/docker-compose.override.yml. They are read-only in Grafana: change the JSON, not the screen.
apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'Warehouse Monitoring'
    folderUid: 'warehouse'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
