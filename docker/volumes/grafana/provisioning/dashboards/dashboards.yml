# Grafana dashboard provisioning
apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: 'Warehouse Monitoring'
    folderUid: 'warehouse'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
