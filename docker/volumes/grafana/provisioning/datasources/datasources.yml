# Grafana datasource configuration
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL-Sec
    type: postgres
    uid: PG_SEC_001
    url: db:5432
    database: postgres
    # pg_monitor and nothing else (migration 94); no superuser, no table rights.
    user: warehouse_monitoring
    secureJsonData:
      password: ${DB_PASSWORD_MONITORING}
    jsonData:
      sslmode: "disable"
      postgresVersion: 1500
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    isDefault: false
    # Provisioned from this file at every start: a change in the UI would not
    # survive the next password rotation, and the datasource must not be repointed.
    editable: false
