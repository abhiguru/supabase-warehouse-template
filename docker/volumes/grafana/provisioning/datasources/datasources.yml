# Grafana datasource configuration
apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned: the dashboard in docker/volumes/grafana/dashboards refers to this uid. It is the uid
    # Grafana has always derived for this datasource, so an existing installation does not change.
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL-Sec
    type: postgres
    uid: PG_SEC_001
    url: db:5432
    database: postgres
    user: postgres
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      sslmode: "disable"
      postgresVersion: 1500
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    isDefault: false
    editable: true
