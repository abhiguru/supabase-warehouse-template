name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker compose --env-file .env.example -f docker/docker-compose.yml -f docker/docker-compose.override.yml config --quiet
      - name: Shell syntax
        run: |
          for script in *.sh scripts/*.sh tests/*.sh; do bash -n "$script"; done
  migrations:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/migrations.sh
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: abhiguru/rn-warehouse-template
          # Reviewed source-demo companion; update deliberately with contract evidence.
          ref: 9bde3c1dc97692055424c916cb9cfeeefc34a3bf
          path: mobile
          persist-credentials: false
      - name: Record tested commit pair
        run: |
          git -C backend log -1 --format='Backend %H'
          git -C mobile log -1 --format='Mobile %H'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mobile
      - run: node scripts/check-mobile-contract.mjs ../mobile
        working-directory: backend

  secrets:
    name: Redacted source and history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/scan-secrets.sh

  demo-api:
    name: Isolated demo API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    env:
      WAREHOUSE_PROJECT_NAME: warehouse-ci-demo
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: abhiguru/rn-warehouse-template
          # Do not infer a branch in a different repository.
          ref: 9bde3c1dc97692055424c916cb9cfeeefc34a3bf
          path: mobile
          persist-credentials: false
      - name: Record tested commit pair
        run: |
          git -C backend log -1 --format='Backend %H'
          git -C mobile log -1 --format='Mobile %H'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: mobile
      - name: Fresh loopback demo
        run: bash setup.sh --demo
        working-directory: backend
      - run: npm run doctor
        working-directory: backend
      - name: Effective RPC signatures and grants
        run: node scripts/check-mobile-contract.mjs ../mobile --live
        working-directory: backend
      - run: npm run test:api
        working-directory: backend
      - name: Preserve config and rerun setup
        run: |
          sha256sum docker/.env > /tmp/warehouse-config.sha256
          stat -c %a docker/.env > /tmp/warehouse-config.mode
          bash setup.sh --demo
          sha256sum -c /tmp/warehouse-config.sha256
          test "$(stat -c %a docker/.env)" = "$(cat /tmp/warehouse-config.mode)"
        working-directory: backend
      - name: Stop only this checkout's demo
        if: always()
        run: test ! -f docker/.env || bash stop.sh
        working-directory: backend
