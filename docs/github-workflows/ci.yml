name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker compose --env-file .env.example -f docker/docker-compose.yml -f docker/docker-compose.override.yml config --quiet
      - name: Shell syntax
        run: |
          for script in *.sh scripts/*.sh tests/*.sh; do bash -n "$script"; done
  migrations:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tests/migrations.sh
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: abhiguru/rn-warehouse-template
          path: mobile
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mobile
      - run: node scripts/check-mobile-contract.mjs ../mobile
        working-directory: backend
