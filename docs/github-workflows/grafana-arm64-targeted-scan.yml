name: Grafana targeted vulnerability scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Native ${{ matrix.arch }} candidate scan
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
            trivy_asset: trivy_0.74.0_Linux-64bit.tar.gz
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
            trivy_asset: trivy_0.74.0_Linux-ARM64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SCAN_IMAGE: warehouse-grafana-scan:${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
      TRIVY_ASSET: ${{ matrix.trivy_asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native runner and prepare private scan directory
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          umask 077
          scan_dir="$RUNNER_TEMP/grafana-scan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$EXPECTED_ARCH"
          mkdir -m 700 "$scan_dir"
          printf 'SCAN_DIR=%s\n' "$scan_dir" >> "$GITHUB_ENV"
      - name: Install checksum-verified Trivy 0.74.0
        shell: bash
        run: |
          set -euo pipefail
          release=https://github.com/aquasecurity/trivy/releases/download/v0.74.0
          curl -fsSL --retry 3 "$release/trivy_0.74.0_checksums.txt" -o "$SCAN_DIR/checksums.txt"
          # Published checksum-file digest: https://github.com/aquasecurity/trivy/releases/tag/v0.74.0
          printf '%s  %s\n' bc701c3c3ee8b9acbea2c23257e41381e3854888f51281616a6ba5dc96963821 "$SCAN_DIR/checksums.txt" | sha256sum -c -
          archive_sha=$(awk -v asset="$TRIVY_ASSET" '$2 == asset { print $1 }' "$SCAN_DIR/checksums.txt")
          test "$archive_sha" != ''
          curl -fsSL --retry 3 "$release/$TRIVY_ASSET" -o "$SCAN_DIR/trivy.tar.gz"
          printf '%s  %s\n' "$archive_sha" "$SCAN_DIR/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$SCAN_DIR/trivy.tar.gz" -C "$SCAN_DIR" trivy
          test "$("$SCAN_DIR/trivy" --version)" = 'Version: 0.74.0'
      - name: Build the checked-out Grafana recipe natively
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          docker build --pull --no-cache --platform "linux/$EXPECTED_ARCH" --build-arg "TARGETARCH=$EXPECTED_ARCH" \
            --file docker/grafana/Dockerfile --tag "$SCAN_IMAGE" docker
          df -h "$RUNNER_TEMP"
          test "$(docker image inspect "$SCAN_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = "linux/$EXPECTED_ARCH"
          printf 'image=%s\nimage_id=%s\nrepository_sha=%s\narchitecture=linux/%s\n' \
            "$SCAN_IMAGE" "$(docker image inspect "$SCAN_IMAGE" --format '{{.Id}}')" "$GITHUB_SHA" "$EXPECTED_ARCH" > "$SCAN_DIR/build.txt"
      - name: Scan and validate the JSON report
        shell: bash
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/grafana-trivy-cache-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          "$SCAN_DIR/trivy" image --quiet --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --list-all-pkgs --exit-code 0 --format json \
            --output "$SCAN_DIR/report.json" "$SCAN_IMAGE"
          image_id=$(docker image inspect "$SCAN_IMAGE" --format '{{.Id}}')
          node - "$SCAN_DIR/report.json" "$SCAN_IMAGE" "$image_id" "$EXPECTED_ARCH" "$SCAN_DIR/summary.txt" "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require('node:fs');
          const [path, image, imageId, arch, summaryPath, stepSummaryPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.SchemaVersion !== 2 || report.ArtifactName !== image ||
              report.ArtifactType !== 'container_image' ||
              report.Metadata?.ImageID !== imageId ||
              report.Metadata?.ImageConfig?.os !== 'linux' ||
              report.Metadata?.ImageConfig?.architecture !== arch ||
              !Array.isArray(report.Results) || report.Results.length === 0) {
            throw new Error('missing or mismatched container scan evidence');
          }
          const counts = { HIGH: 0, CRITICAL: 0 };
          for (const result of report.Results) {
            if (!result.Target || !['os-pkgs', 'lang-pkgs'].includes(result.Class) ||
                !Array.isArray(result.Packages) ||
                !result.Packages.some(pkg => typeof pkg?.Name === 'string' && pkg.Name.length > 0 &&
                  typeof pkg.Version === 'string' && pkg.Version.length > 0) ||
                (result.Vulnerabilities !== undefined && !Array.isArray(result.Vulnerabilities))) {
              throw new Error('invalid result or missing versioned package inventory');
            }
            for (const vulnerability of result.Vulnerabilities ?? []) {
              if (!Object.hasOwn(counts, vulnerability.Severity)) {
                throw new Error(`unexpected vulnerability severity: ${vulnerability.Severity}`);
              }
              counts[vulnerability.Severity]++;
            }
          }
          const summary = `Grafana ${arch}: ${counts.HIGH} HIGH, ${counts.CRITICAL} CRITICAL\n`;
          fs.writeFileSync(summaryPath, summary);
          fs.appendFileSync(stepSummaryPath,
            `### Targeted Grafana ${arch} scan\n\n${summary}\nImage ID: \`${imageId}\`\n\nThe strict production image gate remains \`npm run scan:images\`; this targeted report does not change its result.\n`);
          process.stdout.write(summary);
          NODE
      - name: Upload targeted scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-${{ matrix.arch }}-targeted-scan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/grafana-scan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}/report.json
            ${{ runner.temp }}/grafana-scan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}/summary.txt
            ${{ runner.temp }}/grafana-scan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}/build.txt
          if-no-files-found: warn
          retention-days: 3
      - name: Remove only this run's image and temporary files
        if: always()
        shell: bash
        run: |
          docker image rm "$SCAN_IMAGE" || true
          rm -rf -- "$RUNNER_TEMP/grafana-scan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$EXPECTED_ARCH" \
            "$RUNNER_TEMP/grafana-trivy-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
